<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruby Sketch WASM - Creative Coding in Ruby</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: #16213e;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #0f3460;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 18px;
      color: #e94560;
      font-weight: 700;
      flex-shrink: 0;
    }

    header h1 span {
      color: #e0e0e0;
      font-weight: 400;
    }

    .sidebar-toggle {
      display: none;
      background: none;
      border: 1px solid #0f3460;
      color: #e0e0e0;
      font-size: 18px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 4px;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      margin-left: auto;
      align-items: center;
    }

    .btn {
      padding: 6px 14px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: background 0.2s;
      min-width: 72px;
      height: 32px;
      line-height: 1;
      text-align: center;
    }

    .btn-run {
      background: #e94560;
      color: white;
    }

    .btn-run:hover { background: #c73a52; }

    .btn-run:disabled {
      background: #666;
      cursor: not-allowed;
    }

    .btn-stop {
      background: #f59e0b;
      color: #1a1a2e;
    }

    .btn-stop:hover { background: #d97706; }

    .status {
      font-size: 12px;
      color: #888;
      min-width: 60px;
      text-align: right;
      display: inline-block;
    }

    .status.loading { color: #f59e0b; }
    .status.ready { color: #10b981; }
    .status.running { color: #e94560; }
    .status.error { color: #ef4444; }

    .main-container {
      display: flex;
      flex: 1;
      overflow: hidden;
      min-height: 0;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 220px;
      min-width: 220px;
      background: #121a30;
      border-right: 1px solid #0f3460;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
      transition: margin-left 0.2s;
    }

    .sidebar.collapsed {
      margin-left: -220px;
    }

    .sidebar-header {
      padding: 10px 12px;
      font-size: 11px;
      font-weight: 700;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-bottom: 1px solid #0f3460;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sidebar-collapse-btn {
      background: none;
      border: none;
      color: #666;
      cursor: pointer;
      font-size: 14px;
      padding: 2px 4px;
    }
    .sidebar-collapse-btn:hover { color: #e0e0e0; }

    .sidebar-content {
      flex: 1;
      overflow-y: auto;
      padding: 4px 0;
      user-select: none;
      -webkit-user-select: none;
    }

    .sidebar-content::-webkit-scrollbar { width: 6px; }
    .sidebar-content::-webkit-scrollbar-track { background: transparent; }
    .sidebar-content::-webkit-scrollbar-thumb { background: #2a3050; border-radius: 3px; }

    .category {
      user-select: none;
    }

    .category-header {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      color: #aaa;
      transition: color 0.15s;
    }

    .category-header:hover { color: #e0e0e0; }

    .category-arrow {
      font-size: 10px;
      transition: transform 0.15s;
      width: 12px;
      text-align: center;
    }

    .category.open > .category-header .category-arrow {
      transform: rotate(90deg);
    }

    .category-icon {
      font-size: 14px;
    }

    .category-items {
      display: none;
    }

    .category.open > .category-items {
      display: block;
    }

    .example-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 12px 5px 32px;
      cursor: pointer;
      font-size: 12px;
      color: #999;
      transition: all 0.1s;
      border-left: 2px solid transparent;
    }

    .example-item:hover {
      color: #e0e0e0;
      background: rgba(233, 69, 96, 0.08);
    }

    .example-item.active {
      color: #e94560;
      background: rgba(233, 69, 96, 0.12);
      border-left-color: #e94560;
      font-weight: 600;
    }

    .example-item-icon {
      font-size: 13px;
      flex-shrink: 0;
    }

    .example-item-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Editor / Canvas ── */
    .editor-panel {
      flex: 1;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #0f3460;
      order: 1;
    }

    .canvas-panel {
      flex: 1;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      order: 2;
    }

    .panel-header {
      background: #16213e;
      padding: 6px 16px;
      font-size: 12px;
      color: #888;
      border-bottom: 1px solid #0f3460;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .editor-title {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .current-example-name {
      color: #e94560;
      font-weight: 600;
      font-size: 12px;
    }

    .editor-container {
      position: relative;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    .editor-highlight {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      margin: 0;
      padding: 12px;
      font-family: 'Fira Code', 'Cascadia Code', 'JetBrains Mono', monospace;
      font-size: 14px;
      line-height: 1.5;
      tab-size: 2;
      white-space: pre-wrap;
      word-wrap: break-word;
      overflow-y: auto;
      pointer-events: none;
      z-index: 1;
      background: #0a0a1a;
    }

    textarea {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      color: transparent;
      caret-color: #e0e0e0;
      border: none;
      padding: 12px;
      font-family: 'Fira Code', 'Cascadia Code', 'JetBrains Mono', monospace;
      font-size: 14px;
      line-height: 1.5;
      resize: none;
      outline: none;
      tab-size: 2;
      z-index: 2;
    }

    textarea::selection {
      background: rgba(233, 69, 96, 0.3);
      color: transparent;
    }

    textarea::placeholder { color: #444; }

    /* Syntax highlighting colors */
    .hl-keyword { color: #c678dd; }
    .hl-builtin { color: #61afef; }
    .hl-string { color: #98c379; }
    .hl-number { color: #d19a66; }
    .hl-comment { color: #5c6370; font-style: italic; }
    .hl-symbol { color: #e06c75; }
    .hl-ivar { color: #e5c07b; }
    .hl-global { color: #e06c75; }
    .hl-constant { color: #d19a66; }

    .syntax-status {
      font-size: 11px;
      margin-left: 6px;
      transition: color 0.2s;
    }

    .canvas-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      overflow: auto;
      user-select: none;
      -webkit-user-select: none;
    }

    canvas {
      border: 1px solid #333;
      image-rendering: auto;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    .console-panel {
      height: 120px;
      background: #0a0a1a;
      border-top: 1px solid #0f3460;
      overflow-y: auto;
      padding: 8px 12px;
      font-family: monospace;
      font-size: 12px;
      flex-shrink: 0;
    }

    .console-line { margin: 2px 0; }
    .console-line.info { color: #888; }
    .console-line.output { color: #10b981; }
    .console-line.error { color: #ef4444; }

    .fps-counter {
      font-size: 11px;
      color: #666;
    }

    /*
     * スタック表示: 狭い幅・縦長（スマホ・縦持ちタブレット・狭いウィンドウ）
     * ソース（エディタ）を上、キャンバス＋コンソールを下に配置
     */
    @media (max-width: 900px), (max-aspect-ratio: 12/13) {
      .sidebar-toggle { display: block; }

      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        z-index: 100;
        margin-left: 0 !important;
      }

      .sidebar.collapsed {
        transform: translateX(-100%);
      }

      .sidebar-overlay {
        display: none;
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0,0,0,0.5);
        z-index: 99;
      }

      .sidebar-overlay.visible { display: block; }

      .main-container {
        flex-direction: column;
        align-items: stretch;
      }

      .editor-panel {
        width: 100%;
        flex: 1 1 42%;
        max-height: min(48vh, 360px);
        min-height: 140px;
        border-right: none;
        border-bottom: 1px solid #0f3460;
        order: 1;
      }

      .canvas-panel {
        width: 100%;
        flex: 1 1 58%;
        min-height: 180px;
        order: 2;
      }

      .canvas-wrapper {
        min-height: 0;
      }

      canvas#sketchCanvas {
        max-width: 100%;
        width: auto !important;
        height: auto !important;
      }

      .console-panel {
        height: 72px;
        flex-shrink: 0;
      }

      header {
        flex-wrap: wrap;
        row-gap: 6px;
      }

      header h1 {
        font-size: 16px;
      }

      .header-actions .btn {
        padding: 6px 10px;
        font-size: 12px;
      }

      .editor-run-hint {
        display: none;
      }
    }
  </style>
</head>
<body>
  <header>
    <button class="sidebar-toggle" id="sidebarToggle" title="Toggle sidebar">☰</button>
    <h1>Ruby Sketch <span>WASM</span></h1>
    <div class="header-actions">
      <button id="runBtn" class="btn btn-run" disabled>▶ Run</button>
      <button id="stopBtn" class="btn btn-stop" style="display:none;">■ Stop</button>
    </div>
  </header>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <div class="main-container">
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span>Examples</span>
        <button class="sidebar-collapse-btn" id="sidebarCollapseBtn" title="Collapse sidebar">◀</button>
      </div>
      <div class="sidebar-content" id="sidebarContent">
        <!-- Generated by JS -->
      </div>
    </div>

    <div class="editor-panel">
      <div class="panel-header">
        <div class="editor-title">
          <span>editor.rb</span>
          <span class="current-example-name" id="currentExampleName">Hello World</span>
        </div>
        <span style="font-size:11px;color:#555;"><span class="editor-run-hint">Ctrl+Enter to run</span><span id="syntaxStatus" class="syntax-status"></span></span>
      </div>
      <div class="editor-container">
        <pre id="editorHighlight" class="editor-highlight" aria-hidden="true"></pre>
        <textarea id="editor" spellcheck="false" placeholder="# Write your Ruby sketch here..."></textarea>
      </div>
    </div>
    <div class="canvas-panel">
      <div class="panel-header">
        <span>canvas</span>
        <div style="display:flex; align-items:center; gap:8px; margin-left:auto;">
          <span id="fpsCounter" class="fps-counter"></span>
          <span id="status" class="status loading">Loading...</span>
        </div>
      </div>
      <div class="canvas-wrapper">
        <canvas id="sketchCanvas" width="400" height="400"></canvas>
      </div>
      <div class="console-panel" id="consolePanel"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@ruby/wasm-wasi@2.6.2/dist/browser.umd.js"></script>
  <script>
    // ── State ──
    let rubyVM = null;
    let animationId = null;
    let running = false;
    let frameCount = 0;
    let lastFpsTime = 0;
    let jsMouseX = 0;
    let jsMouseY = 0;

    // ── DOM ──
    const editor = document.getElementById('editor');
    const canvas = document.getElementById('sketchCanvas');
    const ctx = canvas.getContext('2d');
    const runBtn = document.getElementById('runBtn');
    const stopBtn = document.getElementById('stopBtn');
    const statusEl = document.getElementById('status');
    const consolePanel = document.getElementById('consolePanel');
    const fpsCounter = document.getElementById('fpsCounter');
    const currentExampleName = document.getElementById('currentExampleName');
    const sidebar = document.getElementById('sidebar');
    const sidebarContent = document.getElementById('sidebarContent');
    const sidebarToggle = document.getElementById('sidebarToggle');
    const sidebarOverlay = document.getElementById('sidebarOverlay');
    const sidebarCollapseBtn = document.getElementById('sidebarCollapseBtn');

    const editorHighlight = document.getElementById('editorHighlight');
    const syntaxStatusEl = document.getElementById('syntaxStatus');

    const stackedLayoutMq = window.matchMedia('(max-width: 900px), (max-aspect-ratio: 12/13)');
    function isStackedLayout() {
      return stackedLayoutMq.matches;
    }

    /** CSS でキャンバス表示サイズが縮む場合、Ruby 側の座標系（バッファ解像度）に変換 */
    function clientToCanvasXY(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const dw = rect.width || 1;
      const dh = rect.height || 1;
      return {
        x: Math.round((clientX - rect.left) * (canvas.width / dw)),
        y: Math.round((clientY - rect.top) * (canvas.height / dh)),
      };
    }

    let jsMousePressed = false;
    let jsMouseButton = 0;

    // ── Prevent unintended drag and context menu on canvas ──
    canvas.addEventListener('dragstart', (e) => e.preventDefault());
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());

    // ── Mouse/Key events on canvas ──
    canvas.addEventListener('mousemove', (e) => {
      const p = clientToCanvasXY(e.clientX, e.clientY);
      jsMouseX = p.x;
      jsMouseY = p.y;
      if (running && rubyVM) {
        try {
          if (jsMousePressed) {
            rubyVM.eval('Sketch.mouse_dragged_block&.call');
          } else {
            rubyVM.eval('Sketch.mouse_moved_block&.call');
          }
        } catch(err) { logConsole(`Event error: ${err.message}`, 'error'); }
      }
    });

    canvas.addEventListener('mousedown', (e) => {
      const p = clientToCanvasXY(e.clientX, e.clientY);
      jsMouseX = p.x;
      jsMouseY = p.y;
      jsMousePressed = true;
      jsMouseButton = e.button === 0 ? 37 : e.button === 2 ? 39 : 0;
      if (running && rubyVM) {
        try {
          rubyVM.eval(`$__p_mouse_pressed = true; $__p_mouse_button = ${jsMouseButton}; Sketch.mouse_pressed_block&.call`);
        } catch(err) { logConsole(`Event error: ${err.message}`, 'error'); }
      }
    });

    canvas.addEventListener('mouseup', (e) => {
      jsMousePressed = false;
      if (running && rubyVM) {
        try {
          rubyVM.eval('$__p_mouse_pressed = false; Sketch.mouse_released_block&.call');
        } catch(err) { logConsole(`Event error: ${err.message}`, 'error'); }
      }
    });

    canvas.addEventListener('click', (e) => {
      if (running && rubyVM) {
        try {
          rubyVM.eval('Sketch.mouse_clicked_block&.call');
        } catch(err) { logConsole(`Event error: ${err.message}`, 'error'); }
      }
    });

    document.addEventListener('keydown', (e) => {
      if (!running || !rubyVM) return;
      if (e.target === editor) return;
      try {
        const k = e.key.length === 1 ? e.key : '';
        const kc = e.keyCode;
        rubyVM.eval(`$__p_key = "${k.replace(/"/g, '\\"')}"; $__p_key_code = ${kc}; $__p_key_pressed = true; Sketch.key_pressed_block&.call`);
      } catch(err) { logConsole(`Event error: ${err.message}`, 'error'); }
    });

    document.addEventListener('keyup', (e) => {
      if (!running || !rubyVM) return;
      if (e.target === editor) return;
      try {
        rubyVM.eval('$__p_key_pressed = false; Sketch.key_released_block&.call');
      } catch(err) { logConsole(`Event error: ${err.message}`, 'error'); }
    });

    // ── Touch events on canvas ──
    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const touch = e.touches[0];
      const p = clientToCanvasXY(touch.clientX, touch.clientY);
      jsMouseX = p.x;
      jsMouseY = p.y;
      jsMousePressed = true;
      if (running && rubyVM) {
        try {
          const touchData = Array.from(e.touches).map(t => {
            const pt = clientToCanvasXY(t.clientX, t.clientY);
            return `{x: ${pt.x}, y: ${pt.y}, id: ${t.identifier}}`;
          }).join(', ');
          rubyVM.eval(`$__p_mouse_pressed = true; $__p_mouse_x = ${jsMouseX}; $__p_mouse_y = ${jsMouseY}; $__p_touches = [${touchData}]; Sketch.mouse_pressed_block&.call; Sketch.touch_started_block&.call`);
        } catch(err) { logConsole(`Event error: ${err.message}`, 'error'); }
      }
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      const touch = e.touches[0];
      const p = clientToCanvasXY(touch.clientX, touch.clientY);
      jsMouseX = p.x;
      jsMouseY = p.y;
      if (running && rubyVM) {
        try {
          const touchData = Array.from(e.touches).map(t => {
            const pt = clientToCanvasXY(t.clientX, t.clientY);
            return `{x: ${pt.x}, y: ${pt.y}, id: ${t.identifier}}`;
          }).join(', ');
          rubyVM.eval(`$__p_mouse_x = ${jsMouseX}; $__p_mouse_y = ${jsMouseY}; $__p_touches = [${touchData}]; Sketch.mouse_dragged_block&.call; Sketch.touch_moved_block&.call`);
        } catch(err) { logConsole(`Event error: ${err.message}`, 'error'); }
      }
    }, { passive: false });

    canvas.addEventListener('touchend', (e) => {
      e.preventDefault();
      jsMousePressed = false;
      if (running && rubyVM) {
        try {
          rubyVM.eval('$__p_mouse_pressed = false; $__p_touches = []; Sketch.mouse_released_block&.call; Sketch.touch_ended_block&.call');
        } catch(err) { logConsole(`Event error: ${err.message}`, 'error'); }
      }
    }, { passive: false });

    // ── Sidebar ──
    function toggleSidebar() {
      sidebar.classList.toggle('collapsed');
      sidebarOverlay.classList.toggle('visible', !sidebar.classList.contains('collapsed'));
    }

    sidebarToggle.addEventListener('click', toggleSidebar);
    sidebarOverlay.addEventListener('click', toggleSidebar);
    sidebarCollapseBtn.addEventListener('click', () => {
      sidebar.classList.add('collapsed');
      sidebarOverlay.classList.remove('visible');
    });

    // ── Ruby Syntax Highlighter ──
    function highlightRuby(code) {
      // Tokenize properly to avoid overlapping highlights
      const tokens = [];
      let i = 0;
      while (i < code.length) {
        // Comments
        if (code[i] === '#') {
          let end = code.indexOf('\n', i);
          if (end === -1) end = code.length;
          tokens.push({ type: 'comment', text: code.slice(i, end) });
          i = end;
          continue;
        }
        // Double-quoted strings (with interpolation)
        if (code[i] === '"') {
          let j = i + 1;
          while (j < code.length && code[j] !== '"') {
            if (code[j] === '\\') j++;
            j++;
          }
          tokens.push({ type: 'string', text: code.slice(i, j + 1) });
          i = j + 1;
          continue;
        }
        // Single-quoted strings
        if (code[i] === "'") {
          let j = i + 1;
          while (j < code.length && code[j] !== "'") {
            if (code[j] === '\\') j++;
            j++;
          }
          tokens.push({ type: 'string', text: code.slice(i, j + 1) });
          i = j + 1;
          continue;
        }
        // Symbols (:word)
        if (code[i] === ':' && i + 1 < code.length && /[a-zA-Z_]/.test(code[i + 1])) {
          let j = i + 1;
          while (j < code.length && /\w/.test(code[j])) j++;
          tokens.push({ type: 'symbol', text: code.slice(i, j) });
          i = j;
          continue;
        }
        // Instance variables (@word)
        if (code[i] === '@' && i + 1 < code.length && /\w/.test(code[i + 1])) {
          let j = i + 1;
          while (j < code.length && /\w/.test(code[j])) j++;
          tokens.push({ type: 'ivar', text: code.slice(i, j) });
          i = j;
          continue;
        }
        // Global variables ($word)
        if (code[i] === '$' && i + 1 < code.length && /\w/.test(code[i + 1])) {
          let j = i + 1;
          while (j < code.length && /\w/.test(code[j])) j++;
          tokens.push({ type: 'global', text: code.slice(i, j) });
          i = j;
          continue;
        }
        // Words (identifiers, keywords, numbers)
        if (/[a-zA-Z_0-9]/.test(code[i])) {
          let j = i;
          while (j < code.length && /[\w?!]/.test(code[j])) j++;
          // Check if it's a pure number (possibly with decimal)
          const word = code.slice(i, j);
          if (/^\d[\d_.]*\.?\d*$/.test(word)) {
            tokens.push({ type: 'number', text: word });
          } else {
            tokens.push({ type: 'word', text: word });
          }
          i = j;
          continue;
        }
        // Everything else (operators, punctuation, whitespace)
        tokens.push({ type: 'plain', text: code[i] });
        i++;
      }

      const keywords = new Set(['def', 'end', 'do', 'if', 'else', 'elsif', 'unless', 'while', 'until', 'for', 'in', 'case', 'when', 'then', 'class', 'module', 'begin', 'rescue', 'ensure', 'raise', 'return', 'yield', 'require', 'include', 'extend', 'attr_reader', 'attr_writer', 'attr_accessor', 'self', 'true', 'false', 'nil', 'and', 'or', 'not', 'lambda', 'proc', 'puts', 'print', 'p', 'new', 'alias']);
      const builtins = new Set(['setup', 'draw', 'size', 'background', 'fill', 'noFill', 'stroke', 'noStroke', 'strokeWeight', 'circle', 'ellipse', 'rect', 'square', 'triangle', 'quad', 'line', 'point', 'arc', 'text', 'textSize', 'textAlign', 'translate', 'rotate', 'scale', 'push', 'pop', 'pushMatrix', 'popMatrix', 'beginShape', 'endShape', 'vertex', 'mouseX', 'mouseY', 'mousePressed', 'mouseReleased', 'mouseMoved', 'mouseDragged', 'mouseClicked', 'keyPressed', 'keyReleased', 'touchStarted', 'touchMoved', 'touchEnded', 'noLoop', 'loop', 'redraw', 'frameRate', 'frameCount', 'millis', 'width', 'height', 'createVector', 'loadImage', 'image', 'loadSound', 'playTone', 'createCapture', 'createSprite', 'sprite', 'gravity', 'random', 'noise', 'constrain', 'map', 'lerp', 'dist', 'colorMode', 'blendMode', 'filter', 'angleMode', 'rand', 'clamp', 'times', 'each', 'to_i', 'to_f', 'to_s', 'abs', 'round', 'ceil', 'floor', 'min', 'max']);

      function escHtml(s) {
        return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }

      let html = '';
      for (const tok of tokens) {
        const escaped = escHtml(tok.text);
        switch (tok.type) {
          case 'comment':
            html += `<span class="hl-comment">${escaped}</span>`;
            break;
          case 'string':
            html += `<span class="hl-string">${escaped}</span>`;
            break;
          case 'number':
            html += `<span class="hl-number">${escaped}</span>`;
            break;
          case 'symbol':
            html += `<span class="hl-symbol">${escaped}</span>`;
            break;
          case 'ivar':
            html += `<span class="hl-ivar">${escaped}</span>`;
            break;
          case 'global':
            html += `<span class="hl-global">${escaped}</span>`;
            break;
          case 'word':
            if (keywords.has(tok.text)) {
              html += `<span class="hl-keyword">${escaped}</span>`;
            } else if (builtins.has(tok.text)) {
              html += `<span class="hl-builtin">${escaped}</span>`;
            } else if (/^[A-Z][A-Z0-9_]{2,}$/.test(tok.text)) {
              html += `<span class="hl-constant">${escaped}</span>`;
            } else {
              html += escaped;
            }
            break;
          default:
            html += escaped;
        }
      }
      return html;
    }

      vectors: `# Vector Boids - flocking simulation
class Boid
  attr_accessor :pos, :vel, :acc
  def initialize(x, y)
    @pos = createVector(x, y)
    @vel = PVector.random2D
    @vel.mult(rand(1.0..3.0))
    @acc = createVector(0, 0)
  end

  def edges(w, h)
    @pos.x = w if @pos.x < 0
    @pos.x = 0 if @pos.x > w
    @pos.y = h if @pos.y < 0
    @pos.y = 0 if @pos.y > h
  end

  def flock(boids)
    sep = createVector(0, 0)
    ali = createVector(0, 0)
    coh = createVector(0, 0)
    count_s = 0; count_a = 0; count_c = 0

    boids.each do |other|
      next if other.equal?(self)
      d = @pos.dist(other.pos)
      if d < 25
        diff = PVector.sub(@pos, other.pos)
        diff.div(d + 0.01)
        sep.add(diff)
        count_s += 1
      end
      if d < 50
        ali.add(other.vel)
        count_a += 1
        coh.add(other.pos)
        count_c += 1
      end
    end

    if count_s > 0
      sep.div(count_s)
      sep.normalize.mult(3)
      sep.sub(@vel)
      sep.limit(0.3)
      @acc.add(sep)
    end
    if count_a > 0
      ali.div(count_a)
      ali.normalize.mult(3)
      ali.sub(@vel)
      ali.limit(0.2)
      @acc.add(ali)
    end
    if count_c > 0
      coh.div(count_c)
      coh.sub(@pos)
      coh.normalize.mult(3)
      coh.sub(@vel)
      coh.limit(0.2)
      @acc.add(coh)
    end
  end

  def update
    @vel.add(@acc)
    @vel.limit(4)
    @pos.add(@vel)
    @acc.mult(0)
  end

  def draw_boid
    angle = @vel.heading
    hue = ((angle + PI) / TWO_PI * 360).to_i
    pushMatrix do
      translate @pos.x, @pos.y
      rotate angle
      fill "hsl(\#{hue}, 70%, 60%)"
      noStroke
      beginShape
      vertex 10, 0
      vertex(-5, 5)
      vertex(-3, 0)
      vertex(-5, -5)
      endShape CLOSE
    end
  end
end

setup do
  size 400, 400
  @boids = 60.times.map { Boid.new(rand(400), rand(400)) }
end

draw do
  background 26, 26, 46, 38
  @boids.each do |b|
    b.flock(@boids)
    b.update
    b.edges(width, height)
    b.draw_boid
  end

  fill 200
  textSize 12
  text "\#{@boids.size} boids", 10, 20
end`,

      game_of_life: `# Conway's Game of Life
CELL = 8
COLS = 400 / CELL
ROWS = 400 / CELL

def count_neighbors(grid, r, c)
  count = 0
  (-1..1).each do |dr|
    (-1..1).each do |dc|
      next if dr == 0 && dc == 0
      nr = (r + dr) % ROWS
      nc = (c + dc) % COLS
      count += 1 if grid[nr][nc]
    end
  end
  count
end

setup do
  size 400, 400
  @grid = Array.new(ROWS) { Array.new(COLS) { rand < 0.3 } }
end

draw do
  if frameCount % 4 == 0
    new_grid = Array.new(ROWS) { Array.new(COLS, false) }
    ROWS.times do |r|
      COLS.times do |c|
        n = count_neighbors(@grid, r, c)
        new_grid[r][c] = @grid[r][c] ? (n == 2 || n == 3) : (n == 3)
      end
    end
    @grid = new_grid
  end

  background 10, 10, 26

  ROWS.times do |r|
    COLS.times do |c|
      if @grid[r][c]
        hue = (r * 7 + c * 3) % 360
        fill "hsl(\#{hue}, 70%, 55%)"
        rect c * CELL, r * CELL, CELL - 1, CELL - 1
      end
    end
  end
end`,

def draw_branch(x, y, angle, length, depth)
  return if depth <= 0

  t = millis / 1000.0
  sway = Math.sin(t * 2 + depth * 0.5) * 0.1
  end_x = x + Math.cos(angle + sway) * length
  end_y = y + Math.sin(angle + sway) * length

      flappy: `# Flappy Bird - Click or Space to flap!
# --- Flappy Bird 専用（🐔）— 向き・回転は縦速度ベース。Danmaku の ROCKET_* / 矢印向きとは別実装 ---
GRAVITY = 0.4
FLAP_POWER = -6.5
PIPE_SPEED = 2.5
PIPE_GAP = 120
PIPE_WIDTH = 50
# 🐔 鳥絵文字: フォント由来で既に斜め（約45°）なのでベース回転は 0。右向きは X 反転のみ。
# （以前は BIRD_ROT_RAD でさらに45°足して二重になっていた）
BIRD_ROT_RAD = 0.0
BIRD_FLIP_X = -1
# 縦速度 @bird_vy に応じた首振り（vy<0 上昇→上向き、vy>0 落下→下向き）
BIRD_VY_UP = -7.0
BIRD_VY_DOWN = 9.0
BIRD_TILT_UP = -Math::PI / 5.0
BIRD_TILT_DOWN = Math::PI / 4.0

def bird_tilt_from_vy(vy)
  vy = vy.clamp(BIRD_VY_UP, BIRD_VY_DOWN)
  t = (vy - BIRD_VY_UP) / (BIRD_VY_DOWN - BIRD_VY_UP)
  BIRD_TILT_UP + t * (BIRD_TILT_DOWN - BIRD_TILT_UP)
end

# Flappy 専用（Danmaku のロケット描画とは別）
def draw_bird_emoji(x, y, size, extra_rot = 0.0)
  pushMatrix do
    translate x, y
    rotate BIRD_ROT_RAD + extra_rot
    scale BIRD_FLIP_X, 1
    textAlign :center, :center
    textSize size
    text "🐔", 0, 0
  end
end

setup do
  size 400, 400
  @bird_y = 200.0
  @bird_vy = 0.0
  @pipes = []
  @score = 0
  @game_over = false
  @started = false
  @frame = 0
end

draw do
  @frame += 1
  background 135, 206, 235  # sky blue

  # Ground
  fill 34, 139, 34
  noStroke
  rect 0, 360, 400, 40

  # Ground pattern
  fill 50, 160, 50
  10.times do |i|
    rect i * 40 - (@frame * 2) % 40, 360, 20, 5
  end

  if !@started
    fill 255
    textSize 30
    text "Flappy Bird", 100, 150
    textSize 16
    text "Click or Space to start", 100, 200

    # Bird idle animation（上下に漂う速度に合わせて首も振る）
    bob = @frame * 0.1
    bird_display_y = 200 + Math.sin(bob) * 10
    idle_vy = Math.cos(bob) * 1.0
    draw_bird_emoji 185, bird_display_y, 30, bird_tilt_from_vy(idle_vy * 6.0)
  else
    if !@game_over
      # Physics
      @bird_vy += GRAVITY
      @bird_y += @bird_vy

      # Pipes
      if @frame % 90 == 0
        gap_y = rand(100..260)
        @pipes << { x: 420.0, gap_y: gap_y, scored: false }
      end

      @pipes.each do |p|
        p[:x] -= PIPE_SPEED

        # Score
        if !p[:scored] && p[:x] + PIPE_WIDTH < 140
          p[:scored] = true
          @score += 1
        end
      end
      @pipes.reject! { |p| p[:x] < -PIPE_WIDTH }

      # Collision check
      @pipes.each do |p|
        if 140 > p[:x] && 140 < p[:x] + PIPE_WIDTH
          if @bird_y < p[:gap_y] || @bird_y > p[:gap_y] + PIPE_GAP
            @game_over = true
          end
        end
      end

      @game_over = true if @bird_y > 350 || @bird_y < 0
    end

    # Draw pipes
    @pipes.each do |p|
      fill 46, 139, 87
      # Top pipe
      rect p[:x], 0, PIPE_WIDTH, p[:gap_y]
      rect p[:x] - 3, p[:gap_y] - 15, PIPE_WIDTH + 6, 15
      # Bottom pipe
      rect p[:x], p[:gap_y] + PIPE_GAP, PIPE_WIDTH, 400 - p[:gap_y] - PIPE_GAP
      rect p[:x] - 3, p[:gap_y] + PIPE_GAP, PIPE_WIDTH + 6, 15
    end

    # Draw bird（上昇中は上向き、落下中は下向き）
    draw_bird_emoji 130, @bird_y.to_i, 28, bird_tilt_from_vy(@bird_vy)

    # Score
    fill 255
    textSize 28
    text @score.to_s, 195, 40

    if @game_over
      fill "rgba(0,0,0,0.5)"

      textSize 14
      text "Click to restart", 145, 260
    end
  end
end

  elsif !@started
    @started = true

  else

      danmaku: `# Danmaku Shooter - Arrow keys to move, auto-fire!
# --- Danmaku Shooter 専用（🚀）— 弾は常に上向き。機体は移動方向に応じて回転しない（絵文字の見た目補正のみ）。Flappy とは別 ---
# 🚀 絵文字補正 + 反時計回り約23°（-π/8 - 20° - 3°）
ROCKET_ANGLE_BIAS = -Math::PI / 8.0 - 20.0 * Math::PI / 180.0 - 3.0 * Math::PI / 180.0

setup do
  size 400, 400
  @px = 200.0
  @py = 350.0

  @enemies = []
  @enemy_bullets = []
  @score = 0
  @game_over = false
  @frame = 0
  @lives = 3
end

draw do
  @frame += 1
  background 10, 10, 30

  # Stars background
  20.times do |i|
    fill 100 + (i * 37) % 155
    sx = (i * 97 + @frame) % 400
    sy = (i * 53 + @frame * (1 + i % 3)) % 400
    circle sx, sy, 2
  end

  if @game_over
    fill 255
    textSize 30
    text "GAME OVER", 110, 180
    textSize 18
    text "Score: \#{@score}", 155, 220
    textSize 14
    text "Click to restart", 145, 260
  else

  # Player movement via keyboard state
  speed = 4
  @px -= speed if $__p_key_code == 37  # LEFT
  @px += speed if $__p_key_code == 39  # RIGHT
  @py -= speed if $__p_key_code == 38  # UP
  @py += speed if $__p_key_code == 40  # DOWN
  @px = @px.clamp(20, 380)
  @py = @py.clamp(20, 380)

  # Auto fire
  if @frame % 6 == 0
    @bullets << { x: @px - 8, y: @py - 15 }
    @bullets << { x: @px + 8, y: @py - 15 }
  end

  # Spawn enemies
  if @frame % 40 == 0
    @enemies << {
      x: rand(40.0..360.0), y: -20.0,
      vx: rand(-1.0..1.0), vy: rand(1.0..2.0),
      hp: 2, hue: rand(360),
      pattern: rand(3)
    }
  end

  # Update player bullets
  @bullets.each { |b| b[:y] -= 8 }
  @bullets.reject! { |b| b[:y] < -10 }

  # Update enemies
  @enemies.each do |e|
    e[:x] += e[:vx]
    e[:y] += e[:vy]

    # Enemy shooting patterns
    if @frame % 30 == 0
      case e[:pattern]
      when 0  # Aimed shot
        dx = @px - e[:x]
        dy = @py - e[:y]
        d = Math.sqrt(dx*dx + dy*dy) + 0.01
        @enemy_bullets << { x: e[:x], y: e[:y], vx: dx/d*3, vy: dy/d*3 }
      when 1  # Circle burst
        8.times do |i|
          a = i * TWO_PI / 8
          @enemy_bullets << { x: e[:x], y: e[:y], vx: Math.cos(a)*2, vy: Math.sin(a)*2 }
        end
      when 2  # Spiral
        a = @frame * 0.2
        3.times do |i|
          aa = a + i * TWO_PI / 3
          @enemy_bullets << { x: e[:x], y: e[:y], vx: Math.cos(aa)*2.5, vy: Math.sin(aa)*2.5 }
        end
      end
    end
  end
  @enemies.reject! { |e| e[:y] > 420 }

  # Update enemy bullets
  @enemy_bullets.each do |b|
    b[:x] += b[:vx]
    b[:y] += b[:vy]
  end
  @enemy_bullets.reject! { |b| b[:x] < -10 || b[:x] > 410 || b[:y] < -10 || b[:y] > 410 }

  # Hit detection: player bullets vs enemies
  @bullets.reject! do |b|
    hit = false
    @enemies.reject! do |e|
      if (b[:x] - e[:x]).abs < 20 && (b[:y] - e[:y]).abs < 20
        e[:hp] -= 1
        hit = true
        if e[:hp] <= 0
          @score += 100
          true
        else
          false
        end
      else
        false
      end
    end
    hit
  end

  # Hit detection: enemy bullets vs player
  @enemy_bullets.reject! do |b|
    if (b[:x] - @px).abs < 12 && (b[:y] - @py).abs < 12
      @lives -= 1
      @game_over = true if @lives <= 0
      true
    else
      false
    end
  end

  # Draw enemy bullets
  noStroke
  @enemy_bullets.each do |b|
    fill "hsl(\#{(@frame * 3) % 360}, 100%, 70%)"
    circle b[:x], b[:y], 6
  end

  # Draw player bullets
  fill 100, 255, 100
  @bullets.each do |b|
    rect b[:x] - 2, b[:y], 4, 10
  end

  # Draw enemies
  @enemies.each do |e|
    textSize 28
    text "👾", e[:x].to_i - 14, e[:y].to_i
  end

  # 🚀 移動に連動した回転はなし（上下キーでの追加傾きもなし）。ROCKET_ANGLE_BIAS のみ

    textAlign :center, :center

  end

  # HUD

  textSize 14

  text "❤️ x \#{@lives}", 330, 20

  fill 150
  textSize 11
  text "Arrow keys to move", 140, 395
  end
end

mousePressed do

    @px = 200.0; @py = 350.0
    @bullets = []; @enemies = []; @enemy_bullets = []

PADDLE_H = 12

setup do

def reset_game
  bricks = []
  BRICK_ROWS.times do |r|
    BRICK_COLS.times do |c|
      x = 10 + c * (BRICK_W + BRICK_PAD)
      y = 40 + r * (BRICK_H + BRICK_PAD)
      bricks << { x: x, y: y, hue: r * 60, alive: true }
    end
  end
  @bricks = bricks
  @ball = { x: 200.0, y: 300.0, vx: 2.5, vy: -3.5 }
  @paddle_x = 160.0
  @score = 0
  @lives = 3
end

draw do
  background 15, 15, 30

  if @state == :title
    fill 255
    textSize 36
    text "BREAKOUT", 110, 160
    textSize 16
    text "Click to start", 150, 220

    # Animate bricks on title screen
    @bricks.each do |b|
      next unless b[:alive]
      fill "hsl(\#{b[:hue]}, 70%, 55%)"
      noStroke
      rect b[:x], b[:y], BRICK_W, BRICK_H, 2
    end
  else

  # Paddle follows mouse
  @paddle_x = mouseX - PADDLE_W / 2.0
  @paddle_x = @paddle_x.clamp(0, 400 - PADDLE_W)

  if @state == :playing
    # Ball physics
    @ball[:x] += @ball[:vx]
    @ball[:y] += @ball[:vy]

    # Wall bounce
    if @ball[:x] - BALL_R < 0
      @ball[:x] = BALL_R
      @ball[:vx] = @ball[:vx].abs
    elsif @ball[:x] + BALL_R > 400
      @ball[:x] = 400 - BALL_R
      @ball[:vx] = -@ball[:vx].abs
    end
    if @ball[:y] - BALL_R < 0
      @ball[:y] = BALL_R
      @ball[:vy] = @ball[:vy].abs
    end

    # Paddle collision
    if @ball[:vy] > 0 &&
       @ball[:y] + BALL_R >= 370 && @ball[:y] + BALL_R <= 375 &&
       @ball[:x] >= @paddle_x && @ball[:x] <= @paddle_x + PADDLE_W
      @ball[:vy] = -@ball[:vy].abs
      # Add angle based on hit position
      hit_pos = (@ball[:x] - @paddle_x) / PADDLE_W - 0.5
      @ball[:vx] = hit_pos * 6
      speed = Math.sqrt(@ball[:vx]**2 + @ball[:vy]**2)
      @ball[:vx] = @ball[:vx] / speed * 4.5
      @ball[:vy] = @ball[:vy] / speed * 4.5
    end

    # Brick collision
    @bricks.each do |b|
      next unless b[:alive]
      if @ball[:x] + BALL_R > b[:x] && @ball[:x] - BALL_R < b[:x] + BRICK_W &&
         @ball[:y] + BALL_R > b[:y] && @ball[:y] - BALL_R < b[:y] + BRICK_H
        b[:alive] = false
        @score += 10
        # Determine bounce direction
        overlap_left = (@ball[:x] + BALL_R) - b[:x]
        overlap_right = (b[:x] + BRICK_W) - (@ball[:x] - BALL_R)
        overlap_top = (@ball[:y] + BALL_R) - b[:y]
        overlap_bottom = (b[:y] + BRICK_H) - (@ball[:y] - BALL_R)
        min_overlap = [overlap_left, overlap_right, overlap_top, overlap_bottom].min
        if min_overlap == overlap_left || min_overlap == overlap_right
          @ball[:vx] *= -1
        else
          @ball[:vy] *= -1
        end
        break
      end
    end

    # Ball out of bounds
    if @ball[:y] > 410
      @lives -= 1
      if @lives <= 0
        @state = :gameover
      else
        @ball = { x: 200.0, y: 300.0, vx: rand(-2.0..2.0), vy: -3.5 }
      end
    end

    # Win check
    if @bricks.none? { |b| b[:alive] }
      @state = :win
    end
  end

  @bricks.each do |b|

  # HUD

  text "❤️ x \#{@lives}", 330, 20

draw do
  background 26, 26, 46

  if @game_over
    # Draw final state
    draw_grid
    draw_snake
    draw_food

    fill "rgba(0,0,0,0.6)"
    rect 0, 0, 400, 400
    fill 255
    textSize 30
    text "GAME OVER", 110, 180
    textSize 18
    text "Score: \#{@score}", 155, 220
    textSize 14
    text "Click to restart", 145, 260
  else
    # Update at controlled speed
    if !@game_over && frameCount % (60 / @speed) == 0
      @dir = @next_dir.dup

      head = @snake.last
      new_head = { x: head[:x] + @dir[:x], y: head[:y] + @dir[:y] }

      # Wall collision
      if new_head[:x] < 0 || new_head[:x] >= COLS ||
         new_head[:y] < 0 || new_head[:y] >= ROWS
        @game_over = true
      end

      # Self collision
      if !@game_over && @snake.any? { |s| s[:x] == new_head[:x] && s[:y] == new_head[:y] }

      if !@game_over

      minesweeper: `# Mine Sweeper - Click to reveal, right-click to flag
CELL = 30
COLS = 12
ROWS = 12
MINES = 20

setup do
  size COLS * CELL, ROWS * CELL + 40
  reset_game
end

def reset_game
  @board = Array.new(ROWS) { Array.new(COLS, 0) }
  @revealed = Array.new(ROWS) { Array.new(COLS, false) }
  @flagged = Array.new(ROWS) { Array.new(COLS, false) }
  @game_over = false
  @won = false
  @first_click = true
  @mines_left = MINES
end

def place_mines(safe_r, safe_c)
  placed = 0
  while placed < MINES
    r = rand(ROWS)
    c = rand(COLS)
    next if @board[r][c] == -1
    next if (r - safe_r).abs <= 1 && (c - safe_c).abs <= 1
    @board[r][c] = -1
    placed += 1
  end
  # Count neighbors
  ROWS.times do |r|
    COLS.times do |c|
      next if @board[r][c] == -1
      count = 0
      (-1..1).each do |dr|
        (-1..1).each do |dc|
          nr, nc = r + dr, c + dc
          next if nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS
          count += 1 if @board[nr][nc] == -1
        end
      end
      @board[r][c] = count
    end
  end
end

def reveal(r, c)
  return if r < 0 || r >= ROWS || c < 0 || c >= COLS
  return if @revealed[r][c] || @flagged[r][c]
  @revealed[r][c] = true

  if @board[r][c] == -1
    @game_over = true
    # Reveal all mines
    ROWS.times { |rr| COLS.times { |cc| @revealed[rr][cc] = true if @board[rr][cc] == -1 } }
    return
  end

  # Flood fill for 0s
  if @board[r][c] == 0
    (-1..1).each do |dr|
      (-1..1).each do |dc|
        reveal(r + dr, c + dc)
      end
    end
  end
end

def check_win
  ROWS.times do |r|
    COLS.times do |c|
      return false if @board[r][c] != -1 && !@revealed[r][c]
    end
  end
  true
end

draw do
  background 40, 40, 60

  NUM_COLORS = [
    nil,
    "hsl(210, 80%, 60%)",  # 1 blue
    "hsl(120, 70%, 45%)",  # 2 green
    "hsl(0, 80%, 55%)",    # 3 red
    "hsl(240, 70%, 45%)",  # 4 dark blue
    "hsl(0, 60%, 35%)",    # 5 dark red
    "hsl(180, 70%, 45%)",  # 6 cyan
    "hsl(0, 0%, 20%)",     # 7 black
    "hsl(0, 0%, 50%)",     # 8 gray
  ]

  ROWS.times do |r|
    COLS.times do |c|
      x = c * CELL
      y = r * CELL + 40

      if @revealed[r][c]
        fill 70, 70, 90
        stroke 50, 50, 70
        strokeWeight 1
        rect x, y, CELL, CELL

        if @board[r][c] == -1
          textSize 18
          text "💣", x + 6, y + 22
        elsif @board[r][c] > 0
          fill NUM_COLORS[@board[r][c]] || "white"
          noStroke
          textSize 16
          text @board[r][c].to_s, x + 10, y + 24
        end
      else
        # Unrevealed cell
        fill 90, 100, 130
        stroke 110, 120, 150
        strokeWeight 1
        rect x, y, CELL, CELL
        # Highlight
        stroke 120, 130, 165
        line x, y, x + CELL, y
        line x, y, x, y + CELL

        if @flagged[r][c]
          noStroke
          textSize 16
          text "🚩", x + 6, y + 22
        end
      end
    end
  end

  # Header
  fill 200
  noStroke
  textSize 14
  text "💣 \#{@mines_left}", 10, 25
  text "Click: reveal | Long-press: flag", 120, 25

  if @game_over
    fill "rgba(200,50,50,0.3)"
    rect 0, 40, COLS * CELL, ROWS * CELL
    fill 255
    textSize 24
    text "GAME OVER", COLS * CELL / 2 - 70, ROWS * CELL / 2 + 40
    textSize 14
    text "Click to restart", COLS * CELL / 2 - 50, ROWS * CELL / 2 + 70
  elsif @won
    fill "rgba(50,200,50,0.3)"
    rect 0, 40, COLS * CELL, ROWS * CELL
    fill 255
    textSize 24
    text "YOU WIN!", COLS * CELL / 2 - 55, ROWS * CELL / 2 + 40
    textSize 14
    text "Click to restart", COLS * CELL / 2 - 50, ROWS * CELL / 2 + 70
  end

end

mousePressed do
  if @game_over || @won
    reset_game
  else
    c = (mouseX / CELL).to_i
    r = ((mouseY - 40) / CELL).to_i

    if r >= 0 && r < ROWS && c >= 0 && c < COLS
      if $__p_mouse_button == 39  # right click = flag
        unless @revealed[r][c]
          @flagged[r][c] = !@flagged[r][c]
          @mines_left += @flagged[r][c] ? -1 : 1
        end
      else
        if @first_click
          place_mines(r, c)
          @first_click = false
        end
        reveal(r, c) unless @flagged[r][c]
        @won = check_win
      end
    end
  end
  redraw
end`,

      same_game: `# Same Game - click groups of same-colored blocks!
COLS = 15
ROWS = 10
CELL = 26
COLORS = 4
COLOR_MAP = ["hsl(0, 70%, 55%)", "hsl(120, 70%, 55%)", "hsl(220, 70%, 55%)", "hsl(45, 70%, 55%)"]

setup do
  size COLS * CELL, ROWS * CELL + 40
  @board = Array.new(ROWS) { Array.new(COLS) { rand(COLORS) } }
  @score = 0
  @highlight = []
end

def find_group(r, c, color, visited)
  if r < 0 || r >= ROWS || c < 0 || c >= COLS
    visited
  elsif visited.include?([r, c]) || @board[r][c] != color || @board[r][c].nil?
    visited
  else
    visited << [r, c]
    find_group(r-1, c, color, visited)
    find_group(r+1, c, color, visited)
    find_group(r, c-1, color, visited)
    find_group(r, c+1, color, visited)
    visited
  end
end

def remove_group(group)
  group.each { |r, c| @board[r][c] = nil }
  # Drop blocks down
  COLS.times do |c|
    col = (0...ROWS).map { |r| @board[r][c] }.compact
    ROWS.times do |r|
      idx = ROWS - 1 - r
      @board[idx][c] = col.size > r ? col[col.size - 1 - r] : nil
    end
  end
  @score += group.size * group.size
end

draw do
  background 30, 30, 50

  # Draw board
  ROWS.times do |r|
    COLS.times do |c|
      x = c * CELL
      y = r * CELL + 40
      color = @board[r][c]
      if color
        is_hl = @highlight.include?([r, c])
        if is_hl
          fill "hsl(\#{color * 90}, 90%, 75%)"
        else
          fill COLOR_MAP[color]
        end
        noStroke
        rect x + 1, y + 1, CELL - 2, CELL - 2, 3
      end
    end
  end

  # HUD
  fill 200
  textSize 14
  text "Score: \#{@score}", 10, 25
  text "Same Game - click groups!", 150, 25
end

mouseMoved do
  c = (mouseX / CELL).to_i
  r = ((mouseY - 40) / CELL).to_i
  if r >= 0 && r < ROWS && c >= 0 && c < COLS && @board[r][c]
    @highlight = find_group(r, c, @board[r][c], [])
    @highlight = [] if @highlight.size < 2
  else
    @highlight = []
  end
end

mousePressed do
  c = (mouseX / CELL).to_i
  r = ((mouseY - 40) / CELL).to_i
  if r >= 0 && r < ROWS && c >= 0 && c < COLS && @board[r][c]
    group = find_group(r, c, @board[r][c], [])
    if group.size >= 2
      remove_group(group)
      @highlight = []
    end
  end
end`,

SUITS = ["\\u2660", "\\u2665", "\\u2666", "\\u2663"]

  values = (0...8).to_a * 2

  @cards = values.each_with_index.map do |v, i|
    {
      value: v,
      suit: SUITS[v % 4],
      rank: RANKS[v],
      x: (i % 4) * (CARD_W + 20) + 30,
      y: (i / 4) * (CARD_H + 15) + 50,
      face_up: false,
      matched: false
    }
  end
  @flipped = []
  @score = 0
  @moves = 0
  @checking = false
end

draw do
  background 30, 80, 30

  fill 255
  textSize 16
  text "Card Match", 150, 25
  textSize 12
  text "Moves: \#{@moves}  Pairs: \#{@score}/8", 130, 42

  @cards.each do |c|
    if c[:matched]
      # Matched - show faded
      fill 50, 100, 50
      stroke 80, 130, 80
      strokeWeight 1
      rect c[:x], c[:y], CARD_W, CARD_H, 5
    elsif c[:face_up]
      # Face up
      fill 255
      stroke 200
      strokeWeight 1
      rect c[:x], c[:y], CARD_W, CARD_H, 5

      noStroke
      textSize 20

    else
      # Face down
      fill 40, 60, 120
      stroke 60, 80, 150
      strokeWeight 1
      rect c[:x], c[:y], CARD_W, CARD_H, 5
      # Back pattern
      fill 50, 70, 140

    end
  end

  # Check for match after delay

    if @flipped.size == 2
      a, b = @flipped
      if @cards[a][:value] == @cards[b][:value]
        @cards[a][:matched] = true
        @cards[b][:matched] = true
        @score += 1
      else

        @cards[b][:face_up] = false

         !c[:face_up] && !c[:matched] && @flipped.size < 2
        c[:face_up] = true

    // ── Image Store ──
    const imageStore = {};
    let nextImageId = 1;

    window.__rubySketchLoadImage = function(url) {
      const id = nextImageId++;
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.src = url;
      imageStore[id] = { img, loaded: false, width: 0, height: 0 };
      img.onload = () => {
        imageStore[id].loaded = true;
        imageStore[id].width = img.naturalWidth;
        imageStore[id].height = img.naturalHeight;
      };
      return id;
    };

    window.__rubySketchDrawImage = function(id, x, y, w, h) {
      const entry = imageStore[id];
      if (!entry) return;
      if (entry.isVideo) {
        if (entry.img.readyState < 2) return;
        entry.width = entry.img.videoWidth;
        entry.height = entry.img.videoHeight;
      } else if (!entry.loaded) return;
      const c = document.getElementById('sketchCanvas').getContext('2d');
      if (w > 0 && h > 0) {
        c.drawImage(entry.img, x, y, w, h);
      } else {
        c.drawImage(entry.img, x, y);
      }
    };

    window.__rubySketchImageWidth = function(id) {
      const entry = imageStore[id];
      if (!entry) return 0;
      if (entry.isVideo && entry.img.videoWidth) return entry.img.videoWidth;
      return entry.width;
    };

    window.__rubySketchImageHeight = function(id) {
      const entry = imageStore[id];
      return entry ? entry.height : 0;
    };

    window.__rubySketchImageLoaded = function(id) {
      const entry = imageStore[id];
      return entry ? entry.loaded : false;
    };

    // ── Sound Store ──
    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      return audioCtx;
    }

    const soundStore = {};
    let nextSoundId = 1;

    window.__rubySketchLoadSound = function(url) {
      const id = nextSoundId++;
      const audio = new Audio(url);
      audio.preload = 'auto';
      soundStore[id] = audio;
      return id;
    };

    window.__rubySketchPlaySound = function(id, doLoop) {
      const audio = soundStore[id];
      if (!audio) return;
      audio.loop = !!doLoop;
      audio.currentTime = 0;
      audio.play().catch(() => {});
    };

    window.__rubySketchStopSound = function(id) {
      const audio = soundStore[id];
      if (!audio) return;
      audio.pause();
      audio.currentTime = 0;
    };

    window.__rubySketchPlayTone = function(freq, duration, type, volume) {
      const ctx = getAudioCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type || 'sine';
      osc.frequency.value = freq;
      gain.gain.value = volume;
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration);
    };

    window.__rubySketchStopAllSounds = function() {
      Object.values(soundStore).forEach(audio => {
        audio.pause();
        audio.currentTime = 0;
      });
    };

    // ── blendMode ──
    window.__rubySketchBlendMode = function(mode) {
      const c = document.getElementById('sketchCanvas').getContext('2d');
      const modeMap = {
        'blend': 'source-over',
        'add': 'lighter',
        'darkest': 'darken',
        'lightest': 'lighten',
        'difference': 'difference',
        'exclusion': 'exclusion',
        'multiply': 'multiply',
        'screen': 'screen',
        'replace': 'copy',
        'overlay': 'overlay',
        'hard_light': 'hard-light',
        'soft_light': 'soft-light',
        'dodge': 'color-dodge',
        'burn': 'color-burn',
      };
      c.globalCompositeOperation = modeMap[mode] || 'source-over';
    };

    // ── Pixel access ──
    window.__rubySketchGetPixel = function(x, y) {
      const c = document.getElementById('sketchCanvas');
      const ctx = c.getContext('2d');
      const d = ctx.getImageData(x, y, 1, 1).data;
      return [d[0], d[1], d[2], d[3]];
    };

    window.__rubySketchSetPixel = function(x, y, r, g, b, a) {
      const c = document.getElementById('sketchCanvas');
      const ctx = c.getContext('2d');
      const d = ctx.createImageData(1, 1);
      d.data[0] = r; d.data[1] = g; d.data[2] = b; d.data[3] = a;
      ctx.putImageData(d, x, y);
    };

    // ── Filter ──
    window.__rubySketchFilter = function(type, param) {
      const c = document.getElementById('sketchCanvas');
      const ctx = c.getContext('2d');
      const w = c.width, h = c.height;
      const imageData = ctx.getImageData(0, 0, w, h);
      const d = imageData.data;

      switch(type) {
        case 'gray':
          for (let i = 0; i < d.length; i += 4) {
            const avg = (d[i] + d[i+1] + d[i+2]) / 3;
            d[i] = d[i+1] = d[i+2] = avg;
          }
          break;
        case 'invert':
          for (let i = 0; i < d.length; i += 4) {
            d[i] = 255 - d[i];
            d[i+1] = 255 - d[i+1];
            d[i+2] = 255 - d[i+2];
          }
          break;
        case 'threshold':
          const thresh = (param || 0.5) * 255;
          for (let i = 0; i < d.length; i += 4) {
            const avg = (d[i] + d[i+1] + d[i+2]) / 3;
            const val = avg >= thresh ? 255 : 0;
            d[i] = d[i+1] = d[i+2] = val;
          }
          break;
        case 'posterize':
          const levels = param || 4;
          for (let i = 0; i < d.length; i += 4) {
            d[i] = Math.round(d[i] / 255 * (levels-1)) / (levels-1) * 255;
            d[i+1] = Math.round(d[i+1] / 255 * (levels-1)) / (levels-1) * 255;
            d[i+2] = Math.round(d[i+2] / 255 * (levels-1)) / (levels-1) * 255;
          }
          break;
        case 'blur':
          const radius = Math.max(1, param || 1);
          const copy = new Uint8ClampedArray(d);
          for (let y = 0; y < h; y++) {
            for (let x = 0; x < w; x++) {
              let r = 0, g = 0, b = 0, count = 0;
              for (let dy = -radius; dy <= radius; dy++) {
                for (let dx = -radius; dx <= radius; dx++) {
                  const nx = x + dx, ny = y + dy;
                  if (nx >= 0 && nx < w && ny >= 0 && ny < h) {
                    const ni = (ny * w + nx) * 4;
                    r += copy[ni]; g += copy[ni+1]; b += copy[ni+2];
                    count++;
                  }
                }
              }
              const i = (y * w + x) * 4;
              d[i] = r / count; d[i+1] = g / count; d[i+2] = b / count;
            }
          }
          break;
      }
      ctx.putImageData(imageData, 0, 0);
    };

    // ── Camera capture (stream cached across stop/restart) ──
    let _cachedCameraStream = null;

    window.__rubySketchCreateCapture = function() {
      const video = document.createElement('video');
      video.setAttribute('autoplay', '');
      video.setAttribute('playsinline', '');
      video.style.display = 'none';
      document.body.appendChild(video);

      const id = nextImageId++;
      imageStore[id] = { img: video, loaded: true, width: 0, height: 0, isVideo: true };

      function attachStream(stream) {
        _cachedCameraStream = stream;
        video.srcObject = stream;
        video.play().catch(() => {});
      }

      video.addEventListener('loadedmetadata', () => {
        imageStore[id].width = video.videoWidth;
        imageStore[id].height = video.videoHeight;
      });

      if (_cachedCameraStream && _cachedCameraStream.active) {
        attachStream(_cachedCameraStream);
      } else {
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } })
          .then(attachStream)
          .catch(err => console.error('Camera error:', err));
      }

      return id;
    };

    // ── Cleanup (sounds only, camera stream preserved) ──
    window.__rubySketchCleanup = function() {
      Object.values(soundStore).forEach(audio => { audio.pause(); audio.currentTime = 0; });
      Object.values(imageStore).forEach(entry => {
        if (entry.isVideo && entry.img) {
          entry.img.remove();
        }
      });
    };

    // ── Interval timers ──
    const intervalStore = {};

    window.__rubySketchSetInterval = function(durationSec, id) {
      const ms = durationSec * 1000;
      const timerId = setInterval(() => {
        if (running && rubyVM) {
          try {
            rubyVM.eval('$__p_interval_callbacks["' + id + '"]&.call');
          } catch(e) {}
        }
      }, ms);
      intervalStore[id] = timerId;
    };

    window.__rubySketchClearInterval = function(id) {
      if (intervalStore[id]) {
        clearInterval(intervalStore[id]);
        delete intervalStore[id];
      }
    };

    // ── Offscreen graphics ──
    // ── Video frame buffer for delay camera ──
    const frameBuffer = [];
    window.__rubySketchCaptureFrame = function(videoId, w, h) {
      const entry = imageStore[videoId];
      if (!entry || !entry.isVideo || entry.img.readyState < 2) return -1;
      const snap = document.createElement('canvas');
      snap.width = w; snap.height = h;
      snap.getContext('2d').drawImage(entry.img, 0, 0, w, h);
      const id = nextImageId++;
      imageStore[id] = { img: snap, loaded: true, width: w, height: h, isSnapshot: true };
      return id;
    };

    window.__rubySketchDeleteImage = function(id) {
      delete imageStore[id];
    };

    window.__rubySketchCreateOffscreen = function(w, h) {
      const offCanvas = document.createElement('canvas');
      offCanvas.width = w;
      offCanvas.height = h;
      const id = nextImageId++;
      imageStore[id] = { img: offCanvas, loaded: true, width: w, height: h, isOffscreen: true, ctx: offCanvas.getContext('2d') };
      return id;
    };

    // ── Console helpers ──
    function logConsole(text, type = 'info') {
      const line = document.createElement('div');
      line.className = `console-line ${type}`;
      line.textContent = text;
      consolePanel.appendChild(line);
      consolePanel.scrollTop = consolePanel.scrollHeight;
    }

    function clearConsole() {
      consolePanel.innerHTML = '';
    }

    // ── Ruby VM initialization ──
    async function initRuby() {
      try {
        logConsole('Loading ruby.wasm (this may take a moment)...');

        const response = await fetch(
          'https://cdn.jsdelivr.net/npm/@ruby/3.3-wasm-wasi@2.6.2/dist/ruby+stdlib.wasm'
        );
        const buffer = await response.arrayBuffer();
        const module = await WebAssembly.compile(buffer);

        const { DefaultRubyVM } = window["ruby-wasm-wasi"];
        const { vm } = await DefaultRubyVM(module);
        rubyVM = vm;

        // Set up the Processing-compatible sketch DSL in Ruby
        rubyVM.eval(`
          require "js"

          # ── Internal state ──
          module Sketch
            @@draw_block = nil
            @@setup_block = nil

            def self.draw_block; @@draw_block; end
            def self.setup_block; @@setup_block; end

            def self.reset!

              @@setup_block = nil
              @@mouse_pressed_block = nil
              @@mouse_released_block = nil
              @@mouse_moved_block = nil
              @@mouse_dragged_block = nil
              @@mouse_clicked_block = nil
              @@key_pressed_block = nil
              @@key_released_block = nil
              @@key_typed_block = nil
              $__p_width = 400
              $__p_height = 400
              $__p_fill = true
              $__p_fill_color = "rgb(255,255,255)"
              $__p_stroke = true
              $__p_stroke_color = "rgb(0,0,0)"
              $__p_frame_count = 0
              $__p_elapsed_time = 0.0
              $__p_mouse_x = 0
              $__p_mouse_y = 0
              $__p_pmouse_x = 0
              $__p_pmouse_y = 0
              $__p_mouse_pressed = false
              $__p_mouse_button = 0
              $__p_key = ""
              $__p_key_code = 0
              $__p_key_pressed = false
              $__p_looping = true
              $__p_target_fps = 60
              $__p_needs_redraw = false
              $__p_color_mode = :rgb
              $__p_color_max = [255.0, 255.0, 255.0, 255.0]
              $__p_rect_mode = :corner
              $__p_ellipse_mode = :center
              $__p_shape_vertices = []
              $__p_touches = []
              $__p_angle_mode = :radians
              $__p_sprites = []
              $__p_gravity_x = 0
              $__p_gravity_y = 0
              @@touch_started_block = nil
              @@touch_moved_block = nil
              @@touch_ended_block = nil
              $__p_pixels = nil
              $__p_interval_callbacks = {}
            end

            # Event block accessors
            def self.mouse_pressed_block; (defined?(@@mouse_pressed_block) && @@mouse_pressed_block) || nil; end
            def self.mouse_released_block; (defined?(@@mouse_released_block) && @@mouse_released_block) || nil; end
            def self.mouse_moved_block; (defined?(@@mouse_moved_block) && @@mouse_moved_block) || nil; end
            def self.mouse_dragged_block; (defined?(@@mouse_dragged_block) && @@mouse_dragged_block) || nil; end
            def self.mouse_clicked_block; (defined?(@@mouse_clicked_block) && @@mouse_clicked_block) || nil; end
            def self.key_pressed_block; (defined?(@@key_pressed_block) && @@key_pressed_block) || nil; end
            def self.key_released_block; (defined?(@@key_released_block) && @@key_released_block) || nil; end
            def self.key_typed_block; (defined?(@@key_typed_block) && @@key_typed_block) || nil; end
            def self.touch_started_block; (defined?(@@touch_started_block) && @@touch_started_block) || nil; end
            def self.touch_moved_block; (defined?(@@touch_moved_block) && @@touch_moved_block) || nil; end
            def self.touch_ended_block; (defined?(@@touch_ended_block) && @@touch_ended_block) || nil; end
          end

          # Initialize globals
          $__p_width = 400
          $__p_height = 400
          $__p_fill = true
          $__p_fill_color = "rgb(255,255,255)"
          $__p_stroke = true
          $__p_stroke_color = "rgb(0,0,0)"
          $__p_frame_count = 0
          $__p_elapsed_time = 0.0
          $__p_mouse_x = 0
          $__p_mouse_y = 0

          # ── Canvas context bridge ──
          class CanvasContext
            def initialize(js_ctx)
              @ctx = js_ctx
            end

            def fillStyle=(val);    @ctx[:fillStyle] = val; end
            def strokeStyle=(val);  @ctx[:strokeStyle] = val; end
            def lineWidth=(val);    @ctx[:lineWidth] = val; end
            def font=(val);         @ctx[:font] = val; end
            def globalAlpha=(val);  @ctx[:globalAlpha] = val; end
            def lineCap=(val);      @ctx[:lineCap] = val; end
            def lineJoin=(val);     @ctx[:lineJoin] = val; end
            def textAlign=(val);    @ctx[:textAlign] = val; end
            def textBaseline=(val); @ctx[:textBaseline] = val; end
            def shadowColor=(val);  @ctx[:shadowColor] = val; end
            def shadowBlur=(val);   @ctx[:shadowBlur] = val; end
            def shadowOffsetX=(val); @ctx[:shadowOffsetX] = val; end
            def shadowOffsetY=(val); @ctx[:shadowOffsetY] = val; end

            def fillRect(x, y, w, h);   @ctx.call(:fillRect, x, y, w, h); end
            def clearRect(x, y, w, h);  @ctx.call(:clearRect, x, y, w, h); end
            def strokeRect(x, y, w, h); @ctx.call(:strokeRect, x, y, w, h); end
            def beginPath;  @ctx.call(:beginPath); end
            def closePath;  @ctx.call(:closePath); end
            def moveTo(x, y); @ctx.call(:moveTo, x, y); end
            def lineTo(x, y); @ctx.call(:lineTo, x, y); end
            def fill;   @ctx.call(:fill); end
            def stroke; @ctx.call(:stroke); end
            def save;    @ctx.call(:save); end
            def restore; @ctx.call(:restore); end

            def arc(x, y, r, sa, ea)
              r = [r.to_f, 0].max
              @ctx.call(:arc, x, y, r, sa, ea)
            end

            def fillText(text, x, y);   @ctx.call(:fillText, text.to_s, x, y); end
            def strokeText(text, x, y);  @ctx.call(:strokeText, text.to_s, x, y); end
            def translate(x, y); @ctx.call(:translate, x, y); end
            def rotate(angle);   @ctx.call(:rotate, angle); end
            def scale(x, y);     @ctx.call(:scale, x, y); end
            def quadraticCurveTo(cpx, cpy, x, y); @ctx.call(:quadraticCurveTo, cpx, cpy, x, y); end
            def bezierCurveTo(cp1x, cp1y, cp2x, cp2y, x, y); @ctx.call(:bezierCurveTo, cp1x, cp1y, cp2x, cp2y, x, y); end
            def rect(x, y, w, h); @ctx.call(:rect, x, y, w, h); end

            def setLineDash(s); @ctx.call(:setLineDash, s); end

          # ── Color parsing (Processing-compatible) ──
          def _p_parse_color(*args)
            case args.size
            when 1
              a = args[0]
              a.is_a?(String) ? a : "rgb(\#{a},\#{a},\#{a})"
            when 2
              g, al = args
              "rgba(\#{g},\#{g},\#{g},\#{al / 255.0})"
            when 3
              "rgb(\#{args[0]},\#{args[1]},\#{args[2]})"
            when 4
              "rgba(\#{args[0]},\#{args[1]},\#{args[2]},\#{args[3] / 255.0})"
            else
              "rgb(255,255,255)"
            end
          end

          # ── Processing-compatible top-level API ──

          def size(w, h)
            $__p_width = w
            $__p_height = h
          end

          def width;      $__p_width; end
          def height;     $__p_height; end
          def frameCount; $__p_frame_count; end
          def mouseX;     $__p_mouse_x; end
          def mouseY;     $__p_mouse_y; end
          def millis;     ($__p_elapsed_time * 1000).to_i; end

          def background(*args)
            color = _p_parse_color(*args)
            $__canvas_ctx.fillStyle = color
            $__canvas_ctx.fillRect(0, 0, $__p_width, $__p_height)
          end

          def fill(*args)
            $__p_fill = true
            $__p_fill_color = _p_parse_color(*args) unless args.empty?
          end

          def noFill
            $__p_fill = false
          end

          def stroke(*args)
            $__p_stroke = true
            $__p_stroke_color = _p_parse_color(*args) unless args.empty?
          end

          def noStroke
            $__p_stroke = false
          end

          def strokeWeight(w)
            $__canvas_ctx.lineWidth = w
          end

          def line(x1, y1, x2, y2)
            $__canvas_ctx.beginPath
            $__canvas_ctx.moveTo(x1, y1)
            $__canvas_ctx.lineTo(x2, y2)
            $__canvas_ctx.strokeStyle = $__p_stroke_color
            $__canvas_ctx.stroke
          end

          def point(x, y)
            $__canvas_ctx.fillStyle = $__p_stroke_color
            $__canvas_ctx.fillRect(x, y, 1, 1)
          end

          def triangle(x1, y1, x2, y2, x3, y3)
            $__canvas_ctx.beginPath
            $__canvas_ctx.moveTo(x1, y1)
            $__canvas_ctx.lineTo(x2, y2)
            $__canvas_ctx.lineTo(x3, y3)
            $__canvas_ctx.closePath
            if $__p_fill
              $__canvas_ctx.fillStyle = $__p_fill_color
              $__canvas_ctx.fill
            end
            if $__p_stroke
              $__canvas_ctx.strokeStyle = $__p_stroke_color
              $__canvas_ctx.stroke
            end
          end

          def quad(x1, y1, x2, y2, x3, y3, x4, y4)
            $__canvas_ctx.beginPath
            $__canvas_ctx.moveTo(x1, y1)
            $__canvas_ctx.lineTo(x2, y2)
            $__canvas_ctx.lineTo(x3, y3)
            $__canvas_ctx.lineTo(x4, y4)
            $__canvas_ctx.closePath
            if $__p_fill
              $__canvas_ctx.fillStyle = $__p_fill_color
              $__canvas_ctx.fill
            end
            if $__p_stroke
              $__canvas_ctx.strokeStyle = $__p_stroke_color
              $__canvas_ctx.stroke
            end
          end

          def text(str, x, y, w = nil, h = nil)
            if $__p_fill
              $__canvas_ctx.fillStyle = $__p_fill_color
              if w && h
                # Draw text centered in bounding box
                $__canvas_ctx.fillText(str.to_s, x + w / 2.0, y + h / 2.0)
              else
                $__canvas_ctx.fillText(str.to_s, x, y)
              end
            end
          end

          def textSize(s)
            $__canvas_ctx.font = "\#{s}px monospace"
          end

          def textAlign(h_align, v_align = nil)
            case h_align
            when :center, CENTER then $__canvas_ctx.textAlign = "center"
            when :left, LEFT then $__canvas_ctx.textAlign = "left"
            when :right, RIGHT then $__canvas_ctx.textAlign = "right"
            else $__canvas_ctx.textAlign = h_align.to_s
            end
            if v_align
              case v_align
              when :center, CENTER then $__canvas_ctx.textBaseline = "middle"
              when :top, UP then $__canvas_ctx.textBaseline = "top"
              when :bottom, DOWN then $__canvas_ctx.textBaseline = "bottom"
              else $__canvas_ctx.textBaseline = v_align.to_s
              end
            end
          end

          def arc(x, y, w, h, start_angle, stop_angle)
            sa = $__p_angle_mode == :degrees ? start_angle * DEG_TO_RAD : start_angle
            ea = $__p_angle_mode == :degrees ? stop_angle * DEG_TO_RAD : stop_angle
            rx = [w.to_f / 2, 0.001].max
            ry = [h.to_f / 2, 0.001].max
            $__canvas_ctx.save
            $__canvas_ctx.translate(x, y)
            $__canvas_ctx.scale(rx, ry)
            $__canvas_ctx.beginPath
            $__canvas_ctx.arc(0, 0, 1, sa, ea)
            $__canvas_ctx.restore
            if $__p_fill
              $__canvas_ctx.fillStyle = $__p_fill_color
              $__canvas_ctx.fill
            end
            if $__p_stroke
              $__canvas_ctx.strokeStyle = $__p_stroke_color
              $__canvas_ctx.stroke
            end
          end

          def beginShape(kind = nil)
            $__p_shape_vertices = []
            $__p_shape_kind = kind
          end

          def vertex(x, y)
            $__p_shape_vertices << [x, y]
          end

          def bezierVertex(cx1, cy1, cx2, cy2, x, y)
            $__p_shape_vertices << [:bezier, cx1, cy1, cx2, cy2, x, y]
          end

          def curveVertex(x, y)
            $__p_shape_vertices << [:curve, x, y]
          end

          def endShape(mode = nil)

            return if verts.empty?

            first = true
            verts.each do |v|
              if v.is_a?(Array) && v[0] == :bezier
                $__canvas_ctx.bezierCurveTo(v[1], v[2], v[3], v[4], v[5], v[6])
              elsif v.is_a?(Array) && v[0] == :curve
                $__canvas_ctx.lineTo(v[1], v[2]) unless first
                first = false if first
              else
                if first
                  $__canvas_ctx.moveTo(v[0], v[1])
                  first = false
                else
                  $__canvas_ctx.lineTo(v[0], v[1])
                end
              end
            end
            $__canvas_ctx.closePath if mode == CLOSE
            if $__p_fill
              $__canvas_ctx.fillStyle = $__p_fill_color
              $__canvas_ctx.fill
            end
            if $__p_stroke
              $__canvas_ctx.strokeStyle = $__p_stroke_color
              $__canvas_ctx.stroke
            end
            $__p_shape_vertices = []
          end

          # ── Constants ──
          CLOSE = :close
          CENTER = :center
          CORNER = :corner
          CORNERS = :corners
          RADIUS = :radius
          PI = Math::PI
          TWO_PI = Math::PI * 2
          HALF_PI = Math::PI / 2
          QUARTER_PI = Math::PI / 4
          TAU = Math::PI * 2
          DEG_TO_RAD = Math::PI / 180.0
          RAD_TO_DEG = 180.0 / Math::PI
          HSB = :hsb
          RGB = :rgb
          LEFT = :left
          RIGHT = :right
          UP = :up
          DOWN = :down
          DEGREES = :degrees
          RADIANS = :radians

          # ── angleMode ──
          $__p_angle_mode = :radians

          # ── colorMode ──
          $__p_color_mode = :rgb
          $__p_color_max = [255.0, 255.0, 255.0, 255.0]

          def angleMode(mode)
            $__p_angle_mode = mode
          end

          def colorMode(mode, max1 = nil, max2 = nil, max3 = nil, maxA = nil)
            $__p_color_mode = mode
            if max1 && !max2
              $__p_color_max = [max1.to_f, max1.to_f, max1.to_f, max1.to_f]
            elsif max1 && max2 && max3
              $__p_color_max = [max1.to_f, max2.to_f, max3.to_f, (maxA || max1).to_f]
            end
          end

          # Enhanced color parsing with HSB support
          def _p_parse_color(*args)
            case args.size
            when 1
              a = args[0]
              return a if a.is_a?(String)
              if $__p_color_mode == :hsb
                b_pct = (a.to_f / $__p_color_max[2] * 100).clamp(0, 100)
                "hsl(0, 0%, \#{b_pct}%)"
              else
                g = (a.to_f / $__p_color_max[0] * 255).clamp(0, 255).to_i
                "rgb(\#{g},\#{g},\#{g})"
              end
            when 2
              g, al = args
              if $__p_color_mode == :hsb
                b_pct = (g.to_f / $__p_color_max[2] * 100).clamp(0, 100)
                a_val = (al.to_f / $__p_color_max[3]).clamp(0, 1)
                "hsla(0, 0%, \#{b_pct}%, \#{a_val})"
              else
                gv = (g.to_f / $__p_color_max[0] * 255).clamp(0, 255).to_i
                a_val = (al.to_f / $__p_color_max[3]).clamp(0, 1)
                "rgba(\#{gv},\#{gv},\#{gv},\#{a_val})"
              end
            when 3
              if $__p_color_mode == :hsb
                h = (args[0].to_f / $__p_color_max[0] * 360) % 360
                s = (args[1].to_f / $__p_color_max[1] * 100).clamp(0, 100)
                b = (args[2].to_f / $__p_color_max[2] * 100).clamp(0, 100)
                "hsl(\#{h}, \#{s}%, \#{b}%)"
              else
                r = (args[0].to_f / $__p_color_max[0] * 255).clamp(0, 255).to_i
                g = (args[1].to_f / $__p_color_max[1] * 255).clamp(0, 255).to_i
                b = (args[2].to_f / $__p_color_max[2] * 255).clamp(0, 255).to_i
                "rgb(\#{r},\#{g},\#{b})"
              end
            when 4
              if $__p_color_mode == :hsb
                h = (args[0].to_f / $__p_color_max[0] * 360) % 360
                s = (args[1].to_f / $__p_color_max[1] * 100).clamp(0, 100)
                b = (args[2].to_f / $__p_color_max[2] * 100).clamp(0, 100)
                a_val = (args[3].to_f / $__p_color_max[3]).clamp(0, 1)
                "hsla(\#{h}, \#{s}%, \#{b}%, \#{a_val})"
              else
                r = (args[0].to_f / $__p_color_max[0] * 255).clamp(0, 255).to_i
                g = (args[1].to_f / $__p_color_max[1] * 255).clamp(0, 255).to_i
                b = (args[2].to_f / $__p_color_max[2] * 255).clamp(0, 255).to_i
                a_val = (args[3].to_f / $__p_color_max[3]).clamp(0, 1)
                "rgba(\#{r},\#{g},\#{b},\#{a_val})"
              end
            else
              "rgb(255,255,255)"
            end
          end

          # ── rectMode / ellipseMode ──
          $__p_rect_mode = :corner

          def rectMode(mode)

          def ellipseMode(mode)

          def rect(x, y, w, h, *radii)
            rx, ry, rw, rh = x, y, w, h
            case $__p_rect_mode
            when :center
              rx = x - w / 2.0
              ry = y - h / 2.0
            when :corners
              rw = w - x
              rh = h - y
            when :radius
              rx = x - w
              ry = y - h
              rw = w * 2
              rh = h * 2
            end

            if !radii.empty?
              r = radii[0] || 0
              $__canvas_ctx.beginPath
              $__canvas_ctx.moveTo(rx + r, ry)
              $__canvas_ctx.lineTo(rx + rw - r, ry)
              $__canvas_ctx.quadraticCurveTo(rx + rw, ry, rx + rw, ry + r)
              $__canvas_ctx.lineTo(rx + rw, ry + rh - r)
              $__canvas_ctx.quadraticCurveTo(rx + rw, ry + rh, rx + rw - r, ry + rh)
              $__canvas_ctx.lineTo(rx + r, ry + rh)
              $__canvas_ctx.quadraticCurveTo(rx, ry + rh, rx, ry + rh - r)
              $__canvas_ctx.lineTo(rx, ry + r)
              $__canvas_ctx.quadraticCurveTo(rx, ry, rx + r, ry)
              $__canvas_ctx.closePath
              if $__p_fill
                $__canvas_ctx.fillStyle = $__p_fill_color
                $__canvas_ctx.fill
              end
              if $__p_stroke
                $__canvas_ctx.strokeStyle = $__p_stroke_color
                $__canvas_ctx.stroke
              end
            else
              if $__p_fill
                $__canvas_ctx.fillStyle = $__p_fill_color
                $__canvas_ctx.fillRect(rx, ry, rw, rh)
              end
              if $__p_stroke
                $__canvas_ctx.strokeStyle = $__p_stroke_color
                $__canvas_ctx.strokeRect(rx, ry, rw, rh)
              end
            end
          end

          def ellipse(x, y, w, h = w)
            cx, cy, rw, rh = x, y, w, h
            case $__p_ellipse_mode
            when :corner
              cx = x + w / 2.0
              cy = y + h / 2.0
            when :corners
              cx = (x + w) / 2.0
              cy = (y + h) / 2.0
              rw = (w - x).abs
              rh = (h - y).abs
            when :radius
              rw = w * 2
              rh = h * 2
            end
            sx = [rw.to_f / 2, 0.001].max
            sy = [rh.to_f / 2, 0.001].max
            $__canvas_ctx.save
            $__canvas_ctx.translate(cx, cy)
            $__canvas_ctx.scale(sx, sy)
            $__canvas_ctx.beginPath
            $__canvas_ctx.arc(0, 0, 1, 0, Math::PI * 2)
            $__canvas_ctx.restore
            if $__p_fill
              $__canvas_ctx.fillStyle = $__p_fill_color
              $__canvas_ctx.fill
            end
            if $__p_stroke
              $__canvas_ctx.strokeStyle = $__p_stroke_color
              $__canvas_ctx.stroke
            end
          end

          def strokeCap(cap)

            $__canvas_ctx.lineCap = val

          def strokeJoin(join)

          def bezier(x1, y1, cx1, cy1, cx2, cy2, x2, y2)
            $__canvas_ctx.beginPath
            $__canvas_ctx.moveTo(x1, y1)
            $__canvas_ctx.bezierCurveTo(cx1, cy1, cx2, cy2, x2, y2)
            if $__p_stroke
              $__canvas_ctx.strokeStyle = $__p_stroke_color

            end

          def curve(x1, y1, x2, y2, x3, y3, x4, y4)
            cp1x = x2 + (x3 - x1) / 6.0
            cp1y = y2 + (y3 - y1) / 6.0
            cp2x = x3 - (x4 - x2) / 6.0
            cp2y = y3 - (y4 - y2) / 6.0
            $__canvas_ctx.beginPath
            $__canvas_ctx.moveTo(x2, y2)
            $__canvas_ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, x3, y3)
            if $__p_stroke
              $__canvas_ctx.strokeStyle = $__p_stroke_color
              $__canvas_ctx.stroke
            end
          end

          # ── Math helpers ──
          def constrain(val, low, high)

          end

          def self.map(value, start1, stop1, start2, stop2)
            start2 + (stop2 - start2) * ((value - start1).to_f / (stop1 - start1))
          end

          def map(value, start1, stop1, start2, stop2)
            start2 + (stop2 - start2) * ((value - start1).to_f / (stop1 - start1))
          end

          def lerp(start_val, stop_val, amt)

          end

          def dist(*args)
            if args.size == 4
              x1, y1, x2, y2 = args
              Math.sqrt((x2 - x1)**2 + (y2 - y1)**2)
            elsif args.size == 6
              x1, y1, z1, x2, y2, z2 = args
              Math.sqrt((x2 - x1)**2 + (y2 - y1)**2 + (z2 - z1)**2)
            end
          end

          # Perlin noise
          $__p_noise_seed = 0
          $__p_noise_table = nil

          def _p_init_noise
            return if $__p_noise_table
            rng = Random.new(42)
            $__p_noise_table = Array.new(512) { rng.rand }
          end

          def noise(x, y = 0, z = 0)
            _p_init_noise
            xi = x.floor
            yi = y.floor
            xf = x - xi
            yf = y - yi
            u = xf * xf * (3 - 2 * xf)
            v = yf * yf * (3 - 2 * yf)
            i00 = $__p_noise_table[(xi + yi * 57) % 512]
            i10 = $__p_noise_table[(xi + 1 + yi * 57) % 512]
            i01 = $__p_noise_table[(xi + (yi + 1) * 57) % 512]
            i11 = $__p_noise_table[(xi + 1 + (yi + 1) * 57) % 512]
            lerp(lerp(i00, i10, u), lerp(i01, i11, u), v)
          end

          def noiseSeed(seed)
            rng = Random.new(seed)

              elsif a.is_a?(Array)
                a.sample
              else
                rand
              end
            when 2
              low, high = args[0].to_f, args[1].to_f
              low + rand * (high - low)
            else
              rand
            end
          end
