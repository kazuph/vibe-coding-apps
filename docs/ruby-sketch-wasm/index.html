          # ── Vector class ──
          class PVector
            attr_accessor :x, :y, :z
            def initialize(x = 0, y = 0, z = 0)
              @x, @y, @z = x.to_f, y.to_f, z.to_f
            end
            def set(x, y = 0, z = 0)
              @x, @y, @z = x.to_f, y.to_f, z.to_f; self
            end
            def copy; PVector.new(@x, @y, @z); end
            def add(v); @x += v.x; @y += v.y; @z += v.z; self; end
            def sub(v); @x -= v.x; @y -= v.y; @z -= v.z; self; end
            def mult(n); @x *= n; @y *= n; @z *= n; self; end
            def div(n); @x /= n; @y /= n; @z /= n; self; end
            def mag; Math.sqrt(@x*@x + @y*@y + @z*@z); end
            def magSq; @x*@x + @y*@y + @z*@z; end
            def normalize; m = mag; div(m) if m > 0; self; end
            def limit(max); mult(max / mag) if mag > max; self; end
            def heading; Math.atan2(@y, @x); end
            def dist(v); Math.sqrt((@x-v.x)**2 + (@y-v.y)**2 + (@z-v.z)**2); end
            def dot(v); @x*v.x + @y*v.y + @z*v.z; end
            def lerp(v, amt); @x += (v.x - @x) * amt; @y += (v.y - @y) * amt; @z += (v.z - @z) * amt; self; end
            def rotate(angle)
              c = Math.cos(angle); s = Math.sin(angle)
              nx = @x * c - @y * s; ny = @x * s + @y * c
              @x, @y = nx, ny; self
            end
            def to_s; "(\#{@x}, \#{@y}, \#{@z})"; end
            def to_a; [@x, @y, @z]; end

            def self.add(a, b); a.copy.add(b); end
            def self.sub(a, b); a.copy.sub(b); end
            def self.mult(v, n); v.copy.mult(n); end
            def self.div(v, n); v.copy.div(n); end
            def self.dist(a, b); a.dist(b); end
            def self.dot(a, b); a.dot(b); end
            def self.fromAngle(angle); PVector.new(Math.cos(angle), Math.sin(angle)); end
            def self.random2D; fromAngle(rand * Math::PI * 2); end
          end

          # ── Sprite class (RubySketch compatible) ──
          class Sprite
            attr_accessor :x, :y, :w, :h, :z, :vx, :vy, :angle
            attr_accessor :dynamic, :restitution, :density, :friction
            attr_reader :shape

            def initialize(x = 0, y = 0, w = 0, h = 0, shape: nil)
              @x, @y, @w, @h = x.to_f, y.to_f, w.to_f, h.to_f
              @z = 0
              @vx, @vy = 0.0, 0.0
              @angle = 0.0
              @dynamic = false
              @restitution = 0.5
              @density = 1.0
              @friction = 0.3
              @shape = shape
              @draw_block = nil
              @update_block = nil
              @mouse_pressed_block = nil
              @mouse_released_block = nil
              @mouse_moved_block = nil
              @mouse_dragged_block = nil
              @mouse_clicked_block = nil
            end

            def pos; createVector(@x, @y); end
            def pos=(v)
              if v.is_a?(Array)
                @x, @y = v[0].to_f, v[1].to_f
              else
                @x, @y = v.x.to_f, v.y.to_f
              end
            end

            def left; @x; end
            def right; @x + @w; end
            def top; @y; end
            def bottom; @y + @h; end

            def right=(v); @x = v - @w; end
            def bottom=(v); @y = v - @h; end

            def width; @w; end
            def height; @h; end

            def mouseX; $__p_mouse_x - @x; end
            def mouseY; $__p_mouse_y - @y; end
            def pmouseX; $__p_pmouse_x - @x; end
            def pmouseY; $__p_pmouse_y - @y; end
            def mouseButton; $__p_mouse_button; end
            def mousePressed?; $__p_mouse_pressed; end

            def draw(&block); @draw_block = block if block; end
            def update(&block); @update_block = block if block; end
            def mousePressed(&block); @mouse_pressed_block = block if block; end
            def mouseReleased(&block); @mouse_released_block = block if block; end
            def mouseMoved(&block); @mouse_moved_block = block if block; end
            def mouseDragged(&block); @mouse_dragged_block = block if block; end
            def mouseClicked(&block); @mouse_clicked_block = block if block; end

            def _update
              @update_block&.call
              if @dynamic
                @vy += ($__p_gravity_y || 0) / 60.0
                @vx += ($__p_gravity_x || 0) / 60.0
                @x += @vx / 60.0
                @y += @vy / 60.0
              end
            end

            def _draw
              pushMatrix do
                translate @x, @y
                if @angle != 0
                  translate @w / 2.0, @h / 2.0
                  rotate @angle
                  translate(-@w / 2.0, -@h / 2.0)
                end
                if @draw_block
                  default_draw = -> { rect 0, 0, @w, @h }
                  @draw_block.call(&default_draw)
                else
                  rect 0, 0, @w, @h
                end
              end
            end

            def collides?(other)
              @x < other.x + other.w &&
                @x + @w > other.x &&
                @y < other.y + other.h &&
                @y + @h > other.y
            end

            def overlap?(other)
              collides?(other)
            end

            def _contains?(mx, my)
              mx >= @x && mx <= @x + @w && my >= @y && my <= @y + @h
            end

            def _handle_mouse_pressed
              @mouse_pressed_block&.call if _contains?($__p_mouse_x, $__p_mouse_y)
            end

            def _handle_mouse_released
              @mouse_released_block&.call if _contains?($__p_mouse_x, $__p_mouse_y)
            end

            def _handle_mouse_clicked
              @mouse_clicked_block&.call if _contains?($__p_mouse_x, $__p_mouse_y)
            end
          end

          # Sprite helper functions
          $__p_sprites = []
          $__p_gravity_x = 0
          $__p_gravity_y = 0

          def createSprite(x = 0, y = 0, w = 100, h = 100, shape: nil)
            sp = Sprite.new(x, y, w, h, shape: shape)
            $__p_sprites << sp
            sp
          end

          def addSprite(sp)
            $__p_sprites << sp unless $__p_sprites.include?(sp)
          end

          def removeSprite(sp)
            $__p_sprites.delete(sp)
          end

          def sprite(*sprites)
            sprites.flatten.each do |sp|
              sp._update
              sp._draw
            end
          end

          def gravity(x, y)
            $__p_gravity_x = x.to_f
            $__p_gravity_y = y.to_f
          end

          # Shape classes for physics (basic)
          class Circle
            attr_reader :x, :y, :radius
            def initialize(x, y, radius)
              @x, @y, @radius = x.to_f, y.to_f, radius.to_f
            end
          end

          class RectShape
            attr_reader :x, :y, :w, :h
            def initialize(x, y, w, h)
              @x, @y, @w, @h = x.to_f, y.to_f, w.to_f, h.to_f
            end
          end

          # ── blendMode ──
          BLEND = :blend
          ADD = :add
          DARKEST = :darkest
          LIGHTEST = :lightest
          DIFFERENCE = :difference
          EXCLUSION = :exclusion
          MULTIPLY = :multiply
          SCREEN = :screen
          REPLACE = :replace
          OVERLAY = :overlay
          HARD_LIGHT = :hard_light
          SOFT_LIGHT = :soft_light
          DODGE = :dodge
          BURN = :burn

          def blendMode(mode)
            JS.global.call(:__rubySketchBlendMode, mode.to_s)
          end

          # ── Pixel access ──
          $__p_pixels = nil

          def loadPixels
            $__p_pixels = true
          end

          def updatePixels
            $__p_pixels = nil
          end

          def get(x, y)
            result = JS.global.call(:__rubySketchGetPixel, x.to_i, y.to_i)
            [result[0].to_i, result[1].to_i, result[2].to_i, result[3].to_i]
          end

          def set(x, y, c)
            if c.is_a?(Array)
              r, g, b, a = c[0] || 0, c[1] || 0, c[2] || 0, c[3] || 255
            elsif c.is_a?(Numeric)
              r = g = b = c.to_i
              a = 255
            else
              r = g = b = 255
              a = 255
            end
            JS.global.call(:__rubySketchSetPixel, x.to_i, y.to_i, r, g, b, a)
          end

          # ── Filter ──
          GRAY = :gray
          INVERT = :invert
          THRESHOLD = :threshold
          POSTERIZE = :posterize
          BLUR = :blur

          def filter(type, param = nil)
            if param
              JS.global.call(:__rubySketchFilter, type.to_s, param)
            else
              JS.global.call(:__rubySketchFilter, type.to_s, 0)
            end
          end

          # ── Camera capture ──
          class PCapture < PImage
            def initialize
              @id = JS.global.call(:__rubySketchCreateCapture).to_i
            end
          end

          def createCapture
            PCapture.new
          end

          def captureFrame(cam, w = 400, h = 400)
            img_id = cam.is_a?(PImage) ? cam.id : cam.to_i
            snap_id = JS.global.call(:__rubySketchCaptureFrame, img_id, w, h).to_i
            snap_id > 0 ? snap_id : nil
          end

          def deleteImage(img_id)
            id = img_id.is_a?(PImage) ? img_id.id : img_id.to_i
            JS.global.call(:__rubySketchDeleteImage, id)
          end

          # ── Interval timers ──
          $__p_interval_callbacks = {}

          def setInterval(duration, id: nil, &block)
            callback_id = id || "interval_\#{rand(100000)}"
            $__p_interval_callbacks[callback_id.to_s] = block
            JS.global.call(:__rubySketchSetInterval, duration, callback_id.to_s)
            callback_id
          end

          def clearInterval(id)
            $__p_interval_callbacks.delete(id.to_s)
            JS.global.call(:__rubySketchClearInterval, id.to_s)
          end

          # ── Cursor ──
          ARROW = "default"
          CROSS_CURSOR = "crosshair"
          HAND = "pointer"
          MOVE_CURSOR = "move"
          TEXT_CURSOR = "text"

          def cursor(type = nil)
            JS.global[:document].call(:getElementById, "sketchCanvas")[:style][:cursor] = (type || "default").to_s
          end

          def noCursor
            JS.global[:document].call(:getElementById, "sketchCanvas")[:style][:cursor] = "none"
          end

          # ── Shear transforms ──
          def shearX(angle)
            a = $__p_angle_mode == :degrees ? angle * DEG_TO_RAD : angle
            JS.eval("document.getElementById('sketchCanvas').getContext('2d').transform(1, 0, Math.tan(\#{a}), 1, 0, 0)")
          end

          def shearY(angle)
            a = $__p_angle_mode == :degrees ? angle * DEG_TO_RAD : angle
            JS.eval("document.getElementById('sketchCanvas').getContext('2d').transform(1, Math.tan(\#{a}), 0, 1, 0, 0)")
          end

          # ── saveCanvas ──
          def saveCanvas(filename = "sketch.png")
            JS.global[:document].call(:getElementById, "sketchCanvas").call(:toDataURL, "image/png")
          end

          # ── createGraphics (offscreen buffer) ──
          class PGraphics < PImage
            def initialize(w, h)
              @id = JS.global.call(:__rubySketchCreateOffscreen, w, h).to_i
              @w, @h = w, h
            end

            def beginDraw(&block)
              if block
                block.call(self)
              end
            end

            def width; @w; end
            def height; @h; end
          end

          def createGraphics(w, h)
            PGraphics.new(w, h)
          end

          def setTitle(t); end
          def windowWidth; $__p_width; end
          def windowHeight; $__p_height; end

          # Snake_case aliases
          alias no_fill noFill
          alias no_stroke noStroke
          alias stroke_weight strokeWeight
          alias text_size textSize
          alias text_align textAlign
          alias push_matrix pushMatrix
          alias pop_matrix popMatrix
          alias push_style pushStyle
          alias pop_style popStyle
          alias frame_count frameCount
          alias mouse_x mouseX
          alias mouse_y mouseY
          alias pmouse_x pmouseX
          alias pmouse_y pmouseY
          alias mouse_button mouseButton
          alias stroke_cap strokeCap
          alias stroke_join strokeJoin
          alias color_mode colorMode
          alias rect_mode rectMode
          alias ellipse_mode ellipseMode
          alias no_loop noLoop
          alias frame_rate frameRate
          alias create_vector createVector
          alias begin_shape beginShape
          alias end_shape endShape
          alias bezier_vertex bezierVertex
          alias curve_vertex curveVertex
          alias noise_seed noiseSeed
          alias random_seed randomSeed
          alias random_gaussian randomGaussian
          alias lerp_color lerpColor
          alias touch_started touchStarted
          alias touch_moved touchMoved
          alias touch_ended touchEnded
          alias load_image loadImage
          alias image_width imageWidth
          alias image_height imageHeight
          alias image_loaded? imageLoaded?
          alias load_sound loadSound
          alias play_tone playTone
          alias angle_mode angleMode
          alias create_sprite createSprite
          alias add_sprite addSprite
          alias remove_sprite removeSprite
          alias text_align textAlign
          alias create_graphics createGraphics
          alias set_title setTitle
          alias window_width windowWidth
          alias window_height windowHeight
          alias blend_mode blendMode
          alias load_pixels loadPixels
          alias update_pixels updatePixels
          alias create_capture createCapture
          alias save_canvas saveCanvas
          alias no_cursor noCursor
          alias shear_x shearX
          alias shear_y shearY
        `);

        statusEl.textContent = 'Ready';
        statusEl.className = 'status ready';
        runBtn.disabled = false;
        logConsole(`Ruby ${rubyVM.eval('RUBY_VERSION')} loaded successfully!`, 'output');
        logConsole('Processing/RubySketch-compatible API ready', 'info');
      } catch (e) {
        statusEl.textContent = 'Error loading';
        statusEl.className = 'status error';
        logConsole(`Failed to load ruby.wasm: ${e.message}`, 'error');
        console.error(e);
      }
    }

    // ── Sketch execution ──
    function stopSketch() {
      if (animationId) {
        cancelAnimationFrame(animationId);
        animationId = null;
      }
      running = false;
      stopBtn.style.display = 'none';
      runBtn.style.display = '';
      fpsCounter.textContent = '';
      // Clean up sounds, camera, intervals
      try { window.__rubySketchCleanup(); } catch(e) {}
      Object.keys(intervalStore).forEach(id => {
        clearInterval(intervalStore[id]);
        delete intervalStore[id];
      });
    }

    function runSketch() {
      stopSketch();
      clearConsole();

      const code = editor.value;
      if (!code.trim()) {
        logConsole('No code to run.', 'error');
        return;
      }

      try {
        rubyVM.eval('Sketch.reset!');
        rubyVM.eval(`
          instance_variables.each do |v|
            remove_instance_variable(v)
          end
        `);

        rubyVM.eval(code);

        const hasDrawBlock = rubyVM.eval('!Sketch.draw_block.nil?').toString() === 'true';
        const hasSetupBlock = rubyVM.eval('!Sketch.setup_block.nil?').toString() === 'true';

        if (!hasDrawBlock) {
          logConsole('No draw block defined. Use: draw { ... }', 'info');
          return;
        }

        rubyVM.eval(`
          $__js_ctx = JS.global[:document].call(:getElementById, "sketchCanvas").call(:getContext, "2d")
          $__canvas_ctx = CanvasContext.new($__js_ctx)
        `);

        if (hasSetupBlock) {
          rubyVM.eval('Sketch.setup_block.call');
        }

        const w = parseInt(rubyVM.eval('$__p_width').toString(), 10) || 400;
        const h = parseInt(rubyVM.eval('$__p_height').toString(), 10) || 400;
        canvas.width = w;
        canvas.height = h;

        rubyVM.eval(`
          $__js_ctx = JS.global[:document].call(:getElementById, "sketchCanvas").call(:getContext, "2d")
          $__canvas_ctx = CanvasContext.new($__js_ctx)
        `);

        statusEl.textContent = 'Running';
        statusEl.className = 'status running';
        running = true;
        runBtn.style.display = 'none';
        stopBtn.style.display = '';
        frameCount = 0;
        lastFpsTime = performance.now();

        logConsole(`Sketch started (${w}x${h})`, 'output');

        const startTime = performance.now();
        let lastFrameTime = 0;

        function loop(timestamp) {
          if (!running) return;

          try {
            const looping = rubyVM.eval('$__p_looping').toString() === 'true';
            const needsRedraw = rubyVM.eval('$__p_needs_redraw').toString() === 'true';
            const targetFps = parseInt(rubyVM.eval('$__p_target_fps').toString(), 10) || 60;
            const frameInterval = 1000 / targetFps;

            if (!looping && !needsRedraw) {
              animationId = requestAnimationFrame(loop);
              return;
            }

            if (needsRedraw) {
              rubyVM.eval('$__p_needs_redraw = false');
            }

            if (timestamp - lastFrameTime < frameInterval * 0.95) {
              animationId = requestAnimationFrame(loop);
              return;
            }
            lastFrameTime = timestamp;

            const t = (performance.now() - startTime) / 1000;
            frameCount++;

            rubyVM.eval(`$__p_pmouse_x = $__p_mouse_x; $__p_pmouse_y = $__p_mouse_y; $__p_elapsed_time = ${t}; $__p_frame_count = ${frameCount}; $__p_mouse_x = ${jsMouseX}; $__p_mouse_y = ${jsMouseY}; $__p_current_fps = ${Math.round(frameCount * 1000 / Math.max(performance.now() - lastFpsTime, 1))}; Sketch.draw_block.call`);

            const now = performance.now();
            if (now - lastFpsTime >= 1000) {
              const fps = Math.round(frameCount * 1000 / (now - lastFpsTime));
              fpsCounter.textContent = `${fps} fps`;
              frameCount = 0;
              lastFpsTime = now;
            }
          } catch (e) {
            logConsole(`Runtime error: ${e.message}`, 'error');
            stopSketch();
            statusEl.textContent = 'Error';
            statusEl.className = 'status error';
            return;
          }

          animationId = requestAnimationFrame(loop);
        }

        animationId = requestAnimationFrame(loop);
      } catch (e) {
        const msg = e.message || String(e);
        if (msg.includes('syntax error') || msg.includes('SyntaxError')) {
          const lineMatch = msg.match(/eval:(\d+)/);
          const lineNum = lineMatch ? lineMatch[1] : '?';
          logConsole(`Syntax error (line ${lineNum}): ${msg.split('\n')[0]}`, 'error');
          statusEl.textContent = 'Syntax Error';
        } else {
          logConsole(`Error: ${msg}`, 'error');
          statusEl.textContent = 'Error';
        }
        statusEl.className = 'status error';
      }
    }

    // ── Event handlers ──
    runBtn.addEventListener('click', runSketch);
    stopBtn.addEventListener('click', () => {
      stopSketch();
      statusEl.textContent = 'Ready';
      statusEl.className = 'status ready';
    });

    editor.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        runSketch();
      }
      if (e.key === 'Tab') {
        e.preventDefault();
        const start = editor.selectionStart;
        const end = editor.selectionEnd;
        editor.value = editor.value.substring(0, start) + '  ' + editor.value.substring(end);
        editor.selectionStart = editor.selectionEnd = start + 2;
        updateHighlight();
      }
    });

    // ── Real-time syntax check (debounced, only after Ruby VM loaded) ──
    let syntaxCheckTimer = null;
    editor.addEventListener('input', () => {
      clearTimeout(syntaxCheckTimer);
      syntaxCheckTimer = setTimeout(() => {
        if (!rubyVM || running) return;
        const code = editor.value;
        if (!code.trim()) {
          syntaxStatusEl.textContent = '';
          return;
        }
        try {
          // Use eval with a wrapper that catches SyntaxError but doesn't execute
          rubyVM.eval('RubyVM::InstructionSequence.compile(' + JSON.stringify(code) + ')');
          syntaxStatusEl.textContent = ' ✓';
          syntaxStatusEl.style.color = '#10b981';
          // Clear syntax errors from console
          const existingErrors = consolePanel.querySelectorAll('.syntax-error-line');
          existingErrors.forEach(el => el.remove());
        } catch(e) {
          const msg = e.message || '';
          if (msg.includes('syntax error') || msg.includes('SyntaxError')) {
            // Extract line number: format is "eval:LINE:" or "<compiled>:LINE:"
            const lineMatch = msg.match(/(?:eval|<compiled>):(\d+):/);
            const lineNum = lineMatch ? lineMatch[1] : '?';
            const errorDetail = msg.split('\n').find(l => l.includes('syntax error')) || msg.split('\n')[0];
            const cleanError = errorDetail.replace(/.*syntax error,?\s*/, '').trim();
            syntaxStatusEl.textContent = ` ⚠ line ${lineNum}`;
            syntaxStatusEl.style.color = '#ef4444';
            // Show error detail in console (clear previous syntax errors first)
            const existingSyntaxErrors = consolePanel.querySelectorAll('.syntax-error-line');
            existingSyntaxErrors.forEach(el => el.remove());
            const line = document.createElement('div');
            line.className = 'console-line error syntax-error-line';
            line.textContent = `⚠ Syntax error (line ${lineNum}): ${cleanError}`;
            consolePanel.appendChild(line);
            consolePanel.scrollTop = consolePanel.scrollHeight;
          } else {
            syntaxStatusEl.textContent = '';
          }
        }
      }, 1000);
    });

    // ── Init ──
    renderSidebar();

    // Restore category open/close state from localStorage
    restoreCategoryState();

    // Restore last selected example or custom code
    const savedIsCustom = localStorage.getItem('rubySketch_isCustomCode');
    const savedContent = localStorage.getItem('rubySketch_editorContent');
    const savedExample = localStorage.getItem('rubySketch_activeExample');

    if (savedIsCustom === 'true' && savedContent) {
      // User had custom edits - restore them
      if (savedExample && EXAMPLES[savedExample]) {
        activeExampleId = savedExample;
        // Update sidebar active state and name
        let displayName = savedExample;
        CATEGORIES.forEach(cat => {
          cat.examples.forEach(ex => {
            if (ex.id === savedExample) displayName = ex.name;
          });
        });
        currentExampleName.textContent = displayName + ' (edited)';
        sidebarContent.querySelectorAll('.example-item').forEach(item => {
          item.classList.toggle('active', item.dataset.id === savedExample);
        });
      }
      editor.value = savedContent;
      updateHighlight();
      statusEl.textContent = 'Ready';
      statusEl.className = 'status ready';
    } else if (savedExample && EXAMPLES[savedExample]) {
      selectExample(savedExample);
    } else {
      selectExample('hello');
    }

    function syncSidebarForLayout() {
      if (isStackedLayout()) {
        sidebar.classList.add('collapsed');
        sidebarOverlay.classList.remove('visible');
      }
    }
    syncSidebarForLayout();
    stackedLayoutMq.addEventListener('change', syncSidebarForLayout);

    initRuby();
  </script>
</body>
</html>
