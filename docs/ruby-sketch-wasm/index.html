<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruby Sketch WASM - Creative Coding in Ruby</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: #16213e;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #0f3460;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 18px;
      color: #e94560;
      font-weight: 700;
      flex-shrink: 0;
    }

    header h1 span {
      color: #e0e0e0;
      font-weight: 400;
    }

    .sidebar-toggle {
      display: none;
      background: none;
      border: 1px solid #0f3460;
      color: #e0e0e0;
      font-size: 18px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 4px;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      margin-left: auto;
      align-items: center;
    }

    .btn {
      padding: 6px 14px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: background 0.2s;
    }

    .btn-run {
      background: #e94560;
      color: white;
    }

    .btn-run:hover { background: #c73a52; }

    .btn-run:disabled {
      background: #666;
      cursor: not-allowed;
    }

    .btn-stop {
      background: #f59e0b;
      color: #1a1a2e;
    }

    .btn-stop:hover { background: #d97706; }

    .status {
      font-size: 12px;
      color: #888;
    }

    .status.loading { color: #f59e0b; }
    .status.ready { color: #10b981; }
    .status.running { color: #e94560; }
    .status.error { color: #ef4444; }

    .main-container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 220px;
      min-width: 220px;
      background: #121a30;
      border-right: 1px solid #0f3460;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
      transition: margin-left 0.2s;
    }

    .sidebar.collapsed {
      margin-left: -220px;
    }

    .sidebar-header {
      padding: 10px 12px;
      font-size: 11px;
      font-weight: 700;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-bottom: 1px solid #0f3460;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sidebar-collapse-btn {
      background: none;
      border: none;
      color: #666;
      cursor: pointer;
      font-size: 14px;
      padding: 2px 4px;
    }
    .sidebar-collapse-btn:hover { color: #e0e0e0; }

    .sidebar-content {
      flex: 1;
      overflow-y: auto;
      padding: 4px 0;
      user-select: none;
      -webkit-user-select: none;
    }

    .sidebar-content::-webkit-scrollbar { width: 6px; }
    .sidebar-content::-webkit-scrollbar-track { background: transparent; }
    .sidebar-content::-webkit-scrollbar-thumb { background: #2a3050; border-radius: 3px; }

    .category {
      user-select: none;
    }

    .category-header {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      color: #aaa;
      transition: color 0.15s;
    }

    .category-header:hover { color: #e0e0e0; }

    .category-arrow {
      font-size: 10px;
      transition: transform 0.15s;
      width: 12px;
      text-align: center;
    }

    .category.open > .category-header .category-arrow {
      transform: rotate(90deg);
    }

    .category-icon {
      font-size: 14px;
    }

    .category-items {
      display: none;
    }

    .category.open > .category-items {
      display: block;
    }

    .example-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 12px 5px 32px;
      cursor: pointer;
      font-size: 12px;
      color: #999;
      transition: all 0.1s;
      border-left: 2px solid transparent;
    }

    .example-item:hover {
      color: #e0e0e0;
      background: rgba(233, 69, 96, 0.08);
    }

    .example-item.active {
      color: #e94560;
      background: rgba(233, 69, 96, 0.12);
      border-left-color: #e94560;
      font-weight: 600;
    }

    .example-item-icon {
      font-size: 13px;
      flex-shrink: 0;
    }

    .example-item-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Editor / Canvas ── */
    .editor-panel {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #0f3460;
    }

    .canvas-panel {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .panel-header {
      background: #16213e;
      padding: 6px 12px;
      font-size: 12px;
      color: #888;
      border-bottom: 1px solid #0f3460;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .editor-title {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .current-example-name {
      color: #e94560;
      font-weight: 600;
      font-size: 12px;
    }

    textarea {
      flex: 1;
      background: #0a0a1a;
      color: #e0e0e0;
      border: none;
      padding: 12px;
      font-family: 'Fira Code', 'Cascadia Code', 'JetBrains Mono', monospace;
      font-size: 14px;
      line-height: 1.5;
      resize: none;
      outline: none;
      tab-size: 2;
    }

    textarea::placeholder { color: #444; }

    .canvas-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      overflow: auto;
      user-select: none;
      -webkit-user-select: none;
    }

    canvas {
      border: 1px solid #333;
      image-rendering: auto;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    .console-panel {
      height: 120px;
      background: #0a0a1a;
      border-top: 1px solid #0f3460;
      overflow-y: auto;
      padding: 8px 12px;
      font-family: monospace;
      font-size: 12px;
      flex-shrink: 0;
    }

    .console-line { margin: 2px 0; }
    .console-line.info { color: #888; }
    .console-line.output { color: #10b981; }
    .console-line.error { color: #ef4444; }

    .fps-counter {
      font-size: 11px;
      color: #666;
    }

    /* ── Mobile ── */
    @media (max-width: 768px) {
      .sidebar-toggle { display: block; }

      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        z-index: 100;
        margin-left: 0 !important;
      }

      .sidebar.collapsed {
        transform: translateX(-100%);
      }

      .sidebar-overlay {
        display: none;
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0,0,0,0.5);
        z-index: 99;
      }

      .sidebar-overlay.visible { display: block; }

      .main-container { flex-direction: column; }
      .editor-panel, .canvas-panel { width: 100%; flex: 1; }
      .editor-panel { border-right: none; border-bottom: 1px solid #0f3460; }
      .console-panel { height: 80px; }
    }
  </style>
</head>
<body>
  <header>
    <button class="sidebar-toggle" id="sidebarToggle" title="Toggle sidebar">☰</button>
    <h1>Ruby Sketch <span>WASM</span></h1>
    <div class="header-actions">
      <button id="runBtn" class="btn btn-run" disabled>▶ Run</button>
      <button id="stopBtn" class="btn btn-stop" style="display:none;">■ Stop</button>
      <span id="status" class="status loading">Loading ruby.wasm...</span>
    </div>
  </header>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <div class="main-container">
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span>Examples</span>
        <button class="sidebar-collapse-btn" id="sidebarCollapseBtn" title="Collapse sidebar">◀</button>
      </div>
      <div class="sidebar-content" id="sidebarContent">
        <!-- Generated by JS -->
      </div>
    </div>

    <div class="editor-panel">
      <div class="panel-header">
        <div class="editor-title">
          <span>editor.rb</span>
          <span class="current-example-name" id="currentExampleName">Hello World</span>
        </div>
        <span style="font-size:11px;color:#555;">Ctrl+Enter to run</span>
      </div>
      <textarea id="editor" spellcheck="false" placeholder="# Write your Ruby sketch here..."></textarea>
    </div>
    <div class="canvas-panel">
      <div class="panel-header">
        <span>canvas</span>
        <span id="fpsCounter" class="fps-counter"></span>
      </div>
      <div class="canvas-wrapper">
        <canvas id="sketchCanvas" width="400" height="400"></canvas>
      </div>
      <div class="console-panel" id="consolePanel"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@ruby/wasm-wasi@2.6.2/dist/browser.umd.js"></script>
  <script>
    // ── State ──
    let rubyVM = null;
    let animationId = null;
    let running = false;
    let frameCount = 0;
    let lastFpsTime = 0;
    let jsMouseX = 0;
    let jsMouseY = 0;

    // ── DOM ──
    const editor = document.getElementById('editor');
    const canvas = document.getElementById('sketchCanvas');
    const ctx = canvas.getContext('2d');
    const runBtn = document.getElementById('runBtn');
    const stopBtn = document.getElementById('stopBtn');
    const statusEl = document.getElementById('status');
    const consolePanel = document.getElementById('consolePanel');
    const fpsCounter = document.getElementById('fpsCounter');
    const currentExampleName = document.getElementById('currentExampleName');
    const sidebar = document.getElementById('sidebar');
    const sidebarContent = document.getElementById('sidebarContent');
    const sidebarToggle = document.getElementById('sidebarToggle');
    const sidebarOverlay = document.getElementById('sidebarOverlay');
    const sidebarCollapseBtn = document.getElementById('sidebarCollapseBtn');

    let jsMousePressed = false;
    let jsMouseButton = 0;

    // ── Prevent unintended drag and context menu on canvas ──
    canvas.addEventListener('dragstart', (e) => e.preventDefault());
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());

    // ── Mouse/Key events on canvas ──
    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      jsMouseX = Math.round(e.clientX - rect.left);
      jsMouseY = Math.round(e.clientY - rect.top);
      if (running && rubyVM) {
        try {
          if (jsMousePressed) {
            rubyVM.eval('Sketch.mouse_dragged_block&.call');
          } else {
            rubyVM.eval('Sketch.mouse_moved_block&.call');
          }
        } catch(err) { logConsole(`Event error: ${err.message}`, 'error'); }
      }
    });

    canvas.addEventListener('mousedown', (e) => {
      jsMousePressed = true;
      jsMouseButton = e.button === 0 ? 37 : e.button === 2 ? 39 : 0;
      if (running && rubyVM) {
        try {
          rubyVM.eval(`$__p_mouse_pressed = true; $__p_mouse_button = ${jsMouseButton}; Sketch.mouse_pressed_block&.call`);
        } catch(err) { logConsole(`Event error: ${err.message}`, 'error'); }
      }
    });

    canvas.addEventListener('mouseup', (e) => {
      jsMousePressed = false;
      if (running && rubyVM) {
        try {
          rubyVM.eval('$__p_mouse_pressed = false; Sketch.mouse_released_block&.call');
        } catch(err) { logConsole(`Event error: ${err.message}`, 'error'); }
      }
    });

    canvas.addEventListener('click', (e) => {
      if (running && rubyVM) {
        try {
          rubyVM.eval('Sketch.mouse_clicked_block&.call');
        } catch(err) { logConsole(`Event error: ${err.message}`, 'error'); }
      }
    });

    document.addEventListener('keydown', (e) => {
      if (!running || !rubyVM) return;
      if (e.target === editor) return;
      try {
        const k = e.key.length === 1 ? e.key : '';
        const kc = e.keyCode;
        rubyVM.eval(`$__p_key = "${k.replace(/"/g, '\\"')}"; $__p_key_code = ${kc}; $__p_key_pressed = true; Sketch.key_pressed_block&.call`);
      } catch(err) { logConsole(`Event error: ${err.message}`, 'error'); }
    });

    document.addEventListener('keyup', (e) => {
      if (!running || !rubyVM) return;
      if (e.target === editor) return;
      try {
        rubyVM.eval('$__p_key_pressed = false; Sketch.key_released_block&.call');
      } catch(err) { logConsole(`Event error: ${err.message}`, 'error'); }
    });

    // ── Sidebar ──
    function toggleSidebar() {
      sidebar.classList.toggle('collapsed');
      sidebarOverlay.classList.toggle('visible', !sidebar.classList.contains('collapsed'));
    }

    sidebarToggle.addEventListener('click', toggleSidebar);
    sidebarOverlay.addEventListener('click', toggleSidebar);
    sidebarCollapseBtn.addEventListener('click', () => {
      sidebar.classList.add('collapsed');
      sidebarOverlay.classList.remove('visible');
    });

    // ── Example Categories & Data ──
    const CATEGORIES = [
      {
        name: 'Basics',
        icon: '📝',
        open: true,
        examples: [
          { id: 'hello', name: 'Hello World', icon: '👋' },
          { id: 'shapes', name: 'Shapes', icon: '🔷' },
          { id: 'random_walk', name: 'Random Walk', icon: '🔀' },
        ]
      },
      {
        name: 'Animation',
        icon: '🎬',
        open: true,
        examples: [
          { id: 'circles', name: 'Circles', icon: '🔴' },
          { id: 'rainbow', name: 'Rainbow Wave', icon: '🌈' },
          { id: 'starfield', name: 'Starfield', icon: '✨' },
          { id: 'hsb_clock', name: 'HSB Clock', icon: '🕐' },
        ]
      },
      {
        name: 'Interactive',
        icon: '🖱️',
        open: false,
        examples: [
          { id: 'paint', name: 'Interactive Paint', icon: '🎨' },
          { id: 'particles', name: 'Particles', icon: '🎆' },
          { id: 'vectors', name: 'Vector Boids', icon: '🐦' },
        ]
      },
      {
        name: 'Simulation',
        icon: '🔬',
        open: false,
        examples: [
          { id: 'game_of_life', name: 'Game of Life', icon: '🧬' },
          { id: 'fractal_tree', name: 'Fractal Tree', icon: '🌳' },
          { id: 'physics', name: 'Physics', icon: '⚡' },
        ]
      },
      {
        name: 'Games',
        icon: '🎮',
        open: true,
        examples: [
          { id: 'flappy', name: 'Flappy Bird', icon: '🐤' },
          { id: 'danmaku', name: 'Danmaku Shooter', icon: '🚀' },
          { id: 'breakout', name: 'Breakout', icon: '🧱' },
          { id: 'snake', name: 'Snake', icon: '🐍' },
          { id: 'minesweeper', name: 'Mine Sweeper', icon: '💣' },
        ]
      },
    ];

    let activeExampleId = 'hello';

    function renderSidebar() {
      sidebarContent.innerHTML = '';
      CATEGORIES.forEach((cat, ci) => {
        const div = document.createElement('div');
        div.className = `category${cat.open ? ' open' : ''}`;
        div.innerHTML = `
          <div class="category-header" data-cat="${ci}">
            <span class="category-arrow">▶</span>
            <span class="category-icon">${cat.icon}</span>
            <span>${cat.name}</span>
          </div>
          <div class="category-items">
            ${cat.examples.map(ex => `
              <div class="example-item${ex.id === activeExampleId ? ' active' : ''}" data-id="${ex.id}">
                <span class="example-item-icon">${ex.icon}</span>
                <span class="example-item-name">${ex.name}</span>
              </div>
            `).join('')}
          </div>
        `;
        sidebarContent.appendChild(div);
      });

      // Category toggle
      sidebarContent.querySelectorAll('.category-header').forEach(h => {
        h.addEventListener('click', () => {
          h.parentElement.classList.toggle('open');
        });
      });

      // Example select
      sidebarContent.querySelectorAll('.example-item').forEach(item => {
        item.addEventListener('click', () => {
          const id = item.dataset.id;
          selectExample(id);
          // On mobile, close sidebar after selection
          if (window.innerWidth <= 768) {
            sidebar.classList.add('collapsed');
            sidebarOverlay.classList.remove('visible');
          }
        });
      });
    }

    function selectExample(id) {
      if (!EXAMPLES[id]) return;
      activeExampleId = id;
      stopSketch();
      editor.value = EXAMPLES[id];
      // Find display name
      let displayName = id;
      CATEGORIES.forEach(cat => {
        cat.examples.forEach(ex => {
          if (ex.id === id) displayName = ex.name;
        });
      });
      currentExampleName.textContent = displayName;
      statusEl.textContent = 'Ready';
      statusEl.className = 'status ready';
      // Update active state
      sidebarContent.querySelectorAll('.example-item').forEach(item => {
        item.classList.toggle('active', item.dataset.id === id);
      });
    }

    // ── Examples ──
    const EXAMPLES = {
      // ── Basics ──
      hello: `# Hello World - move your mouse!
setup do
  size 400, 400
end

draw do
  background 0, 15
  fill 255
  textSize 40
  text "Hello, Ruby!", mouseX, mouseY
end`,

      shapes: `# Basic Shapes Gallery
setup do
  size 400, 400
end

draw do
  background 26, 26, 46

  # Row 1
  noStroke
  fill "hsl(0, 70%, 60%)"
  circle 80, 80, 60

  fill "hsl(60, 70%, 60%)"
  rect 150, 50, 60, 60

  fill "hsl(120, 70%, 60%)"
  triangle 280, 50, 310, 110, 250, 110

  # Row 2
  fill "hsl(180, 70%, 60%)"
  ellipse 80, 180, 80, 50

  fill "hsl(240, 70%, 60%)"
  square 150, 155, 50

  fill "hsl(300, 70%, 60%)"
  quad 250, 155, 320, 160, 310, 210, 260, 205

  # Lines
  stroke "hsl(30, 90%, 60%)"
  strokeWeight 3
  line 50, 260, 350, 260
  strokeWeight 1

  # Labels
  noStroke
  fill 200
  textSize 14
  text "circle", 55, 130
  text "rect", 160, 130
  text "triangle", 255, 130
  text "ellipse", 50, 220
  text "square", 155, 220
  text "quad", 260, 220
  text "line", 50, 285

  # Interactive circle follows mouse
  fill "hsla(45, 100%, 70%, 0.7)"
  circle mouseX, mouseY, 30

  fill 150
  textSize 11
  text "Move your mouse!", 140, 380

  noLoop
  redraw if mouseX > 0
end

mouseMoved do
  redraw
end`,

      random_walk: `# Random Walk Triangles
setup do
  size 400, 400
  background 26, 26, 46
  @x = 200.0
  @y = 200.0
  @hue = 0
end

draw do
  @x += rand(-8.0..8.0)
  @y += rand(-8.0..8.0)
  @x = @x.clamp(20, 380)
  @y = @y.clamp(20, 380)

  s = rand(10..30)
  @hue = (@hue + 3) % 360

  fill "hsla(\#{@hue}, 70%, 60%, 0.6)"
  noStroke

  x1 = @x + rand(-s..s)
  y1 = @y + rand(-s..s)
  x2 = @x + rand(-s..s)
  y2 = @y + rand(-s..s)
  x3 = @x + rand(-s..s)
  y3 = @y + rand(-s..s)
  triangle x1, y1, x2, y2, x3, y3
end`,

      // ── Animation ──
      circles: `# Colorful bouncing circles
setup do
  size 400, 400
  @balls = 20.times.map do
    {
      x: rand(400), y: rand(400),
      vx: rand(-3.0..3.0), vy: rand(-3.0..3.0),
      d: rand(30..80),
      hue: rand(360)
    }
  end
end

draw do
  background 26, 26, 46, 38

  @balls.each do |b|
    b[:x] += b[:vx]
    b[:y] += b[:vy]
    r = b[:d] / 2.0
    b[:vx] *= -1 if b[:x] < r || b[:x] > width - r
    b[:vy] *= -1 if b[:y] < r || b[:y] > height - r

    fill "hsl(\#{b[:hue]}, 70%, 60%)"
    circle b[:x], b[:y], b[:d]
  end
end`,

      rainbow: `# Rainbow sine wave
setup do
  size 400, 400
end

draw do
  background 10, 10, 26, 13
  t = millis / 1000.0

  200.times do |i|
    x = i * 2
    hue = (i * 1.8 + t * 60) % 360
    y = 200 + Math.sin(i * 0.05 + t * 2) * 80 +
        Math.sin(i * 0.02 + t * 1.5) * 40

    fill "hsl(\#{hue}, 80%, 60%)"
    circle x, y, 6
  end
end`,

      starfield: `# 3D Starfield
setup do
  size 400, 400
  @stars = 200.times.map do
    { x: rand(-200.0..200.0), y: rand(-200.0..200.0), z: rand(1.0..400.0) }
  end
end

draw do
  background 0, 51

  @stars.each do |s|
    s[:z] -= 3

    if s[:z] <= 0
      s[:x] = rand(-200.0..200.0)
      s[:y] = rand(-200.0..200.0)
      s[:z] = 400.0
    end

    sx = (s[:x] / s[:z]) * 200 + 200
    sy = (s[:y] / s[:z]) * 200 + 200
    d = (1 - s[:z] / 400.0) * 6
    brightness = ((1 - s[:z] / 400.0) * 255).to_i

    fill brightness
    circle sx, sy, [d, 0.5].max
  end
end`,

      hsb_clock: `# HSB Color Mode Clock
setup do
  size 400, 400
  colorMode HSB, 360, 100, 100
end

draw do
  background 220, 15, 15
  t = millis / 1000.0

  # Draw hour marks
  pushMatrix do
    translate 200, 200
    12.times do |i|
      angle = i * (TWO_PI / 12) - HALF_PI
      x1 = Math.cos(angle) * 150
      y1 = Math.sin(angle) * 150
      x2 = Math.cos(angle) * 170
      y2 = Math.sin(angle) * 170
      stroke i * 30, 80, 90
      strokeWeight 4
      line x1, y1, x2, y2
    end
  end

  # Minute ticks
  pushMatrix do
    translate 200, 200
    60.times do |i|
      angle = i * (TWO_PI / 60) - HALF_PI
      x1 = Math.cos(angle) * 160
      y1 = Math.sin(angle) * 160
      x2 = Math.cos(angle) * 170
      y2 = Math.sin(angle) * 170
      stroke i * 6, 50, 70

      vectors: `# Vector Boids - flocking simulation
class Boid
  attr_accessor :pos, :vel, :acc
  def initialize(x, y)
    @pos = createVector(x, y)
    @vel = PVector.random2D
    @vel.mult(rand(1.0..3.0))
    @acc = createVector(0, 0)
  end

  def edges(w, h)
    @pos.x = w if @pos.x < 0
    @pos.x = 0 if @pos.x > w
    @pos.y = h if @pos.y < 0
    @pos.y = 0 if @pos.y > h
  end

  def flock(boids)
    sep = createVector(0, 0)
    ali = createVector(0, 0)
    coh = createVector(0, 0)
    count_s = 0; count_a = 0; count_c = 0

    boids.each do |other|
      next if other.equal?(self)
      d = @pos.dist(other.pos)
      if d < 25
        diff = PVector.sub(@pos, other.pos)
        diff.div(d + 0.01)
        sep.add(diff)
        count_s += 1
      end
      if d < 50
        ali.add(other.vel)
        count_a += 1
        coh.add(other.pos)
        count_c += 1
      end
    end

    if count_s > 0
      sep.div(count_s)
      sep.normalize.mult(3)
      sep.sub(@vel)
      sep.limit(0.3)
      @acc.add(sep)
    end
    if count_a > 0
      ali.div(count_a)
      ali.normalize.mult(3)
      ali.sub(@vel)
      ali.limit(0.2)
      @acc.add(ali)
    end
    if count_c > 0
      coh.div(count_c)
      coh.sub(@pos)
      coh.normalize.mult(3)
      coh.sub(@vel)
      coh.limit(0.2)
      @acc.add(coh)
    end
  end

  def update
    @vel.add(@acc)
    @vel.limit(4)
    @pos.add(@vel)
    @acc.mult(0)
  end

  def draw_boid
    angle = @vel.heading
    hue = ((angle + PI) / TWO_PI * 360).to_i
    pushMatrix do
      translate @pos.x, @pos.y
      rotate angle
      fill "hsl(\#{hue}, 70%, 60%)"
      noStroke
      beginShape
      vertex 10, 0
      vertex(-5, 5)
      vertex(-3, 0)
      vertex(-5, -5)
      endShape CLOSE
    end
  end
end

setup do
  size 400, 400
  @boids = 60.times.map { Boid.new(rand(400), rand(400)) }
end

draw do
  background 26, 26, 46, 38
  @boids.each do |b|
    b.flock(@boids)
    b.update
    b.edges(width, height)
    b.draw_boid
  end

  fill 200
  textSize 12
  text "\#{@boids.size} boids", 10, 20
end`,

      game_of_life: `# Conway's Game of Life
CELL = 8
COLS = 400 / CELL
ROWS = 400 / CELL

def count_neighbors(grid, r, c)
  count = 0
  (-1..1).each do |dr|
    (-1..1).each do |dc|
      next if dr == 0 && dc == 0
      nr = (r + dr) % ROWS
      nc = (c + dc) % COLS
      count += 1 if grid[nr][nc]
    end
  end
  count
end

setup do
  size 400, 400
  @grid = Array.new(ROWS) { Array.new(COLS) { rand < 0.3 } }
end

draw do
  if frameCount % 4 == 0
    new_grid = Array.new(ROWS) { Array.new(COLS, false) }
    ROWS.times do |r|
      COLS.times do |c|
        n = count_neighbors(@grid, r, c)
        new_grid[r][c] = @grid[r][c] ? (n == 2 || n == 3) : (n == 3)
      end
    end
    @grid = new_grid
  end

  background 10, 10, 26

  ROWS.times do |r|
    COLS.times do |c|
      if @grid[r][c]
        hue = (r * 7 + c * 3) % 360
        fill "hsl(\#{hue}, 70%, 55%)"
        rect c * CELL, r * CELL, CELL - 1, CELL - 1
      end
    end
  end
end`,

def draw_branch(x, y, angle, length, depth)
  return if depth <= 0

  t = millis / 1000.0
  sway = Math.sin(t * 2 + depth * 0.5) * 0.1
  end_x = x + Math.cos(angle + sway) * length
  end_y = y + Math.sin(angle + sway) * length

  hue = 120 - depth * 10
  lightness = 30 + depth * 5

  stroke "hsl(\#{hue}, 60%, \#{lightness}%)"
  strokeWeight depth * 1.2
  line end_x, end_y, x, y

  new_len = length * 0.72
  draw_branch(end_x, end_y, angle - 0.5, new_len, depth - 1)
  draw_branch(end_x, end_y, angle + 0.5, new_len, depth - 1)
end

    textSize 14

  else

  # Player movement via keyboard state
  speed = 4
  @px -= speed if $__p_key_code == 37  # LEFT
  @px += speed if $__p_key_code == 39  # RIGHT
  @py -= speed if $__p_key_code == 38  # UP
  @py += speed if $__p_key_code == 40  # DOWN
  @px = @px.clamp(20, 380)
  @py = @py.clamp(20, 380)

  # Auto fire
  if @frame % 6 == 0
    @bullets << { x: @px - 8, y: @py - 15 }
    @bullets << { x: @px + 8, y: @py - 15 }
  end

  # Spawn enemies
  if @frame % 40 == 0
    @enemies << {
      x: rand(40.0..360.0), y: -20.0,
      vx: rand(-1.0..1.0), vy: rand(1.0..2.0),
      hp: 2, hue: rand(360),
      pattern: rand(3)
    }
  end

  # Update player bullets
  @bullets.each { |b| b[:y] -= 8 }
  @bullets.reject! { |b| b[:y] < -10 }

  # Update enemies
  @enemies.each do |e|
    e[:x] += e[:vx]
    e[:y] += e[:vy]

    # Enemy shooting patterns
    if @frame % 30 == 0
      case e[:pattern]
      when 0  # Aimed shot
        dx = @px - e[:x]
        dy = @py - e[:y]
        d = Math.sqrt(dx*dx + dy*dy) + 0.01
        @enemy_bullets << { x: e[:x], y: e[:y], vx: dx/d*3, vy: dy/d*3 }
      when 1  # Circle burst
        8.times do |i|
          a = i * TWO_PI / 8
          @enemy_bullets << { x: e[:x], y: e[:y], vx: Math.cos(a)*2, vy: Math.sin(a)*2 }
        end
      when 2  # Spiral
        a = @frame * 0.2
        3.times do |i|
          aa = a + i * TWO_PI / 3
          @enemy_bullets << { x: e[:x], y: e[:y], vx: Math.cos(aa)*2.5, vy: Math.sin(aa)*2.5 }
        end
      end
    end
  end
  @enemies.reject! { |e| e[:y] > 420 }

  # Update enemy bullets
  @enemy_bullets.each do |b|
    b[:x] += b[:vx]
    b[:y] += b[:vy]
  end
  @enemy_bullets.reject! { |b| b[:x] < -10 || b[:x] > 410 || b[:y] < -10 || b[:y] > 410 }

  # Hit detection: player bullets vs enemies
  @bullets.reject! do |b|
    hit = false
    @enemies.reject! do |e|
      if (b[:x] - e[:x]).abs < 20 && (b[:y] - e[:y]).abs < 20
        e[:hp] -= 1
        hit = true
        if e[:hp] <= 0
          @score += 100
          true
        else
          false
        end
      else
        false
      end
    end
    hit
  end

    if (b[:x] - @px).abs < 12 && (b[:y] - @py).abs < 12
      @lives -= 1
      @game_over = true if @lives <= 0
      true
    else
      false
    end
  end

  # Draw enemy bullets

  @enemy_bullets.each do |b|
    fill "hsl(\#{(@frame * 3) % 360}, 100%, 70%)"
    circle b[:x], b[:y], 6
  end

  # Draw player bullets

  text "\\u{1F680}", @px.to_i - 14, @py.to_i

  textSize 14

  text "\\u{2764}\\u{FE0F} x \#{@lives}", 330, 20

  textSize 11
  text "Arrow keys to move", 140, 395
  end

  @state = :title
  reset_game

def reset_game
  bricks = []
  BRICK_ROWS.times do |r|
    BRICK_COLS.times do |c|
      x = 10 + c * (BRICK_W + BRICK_PAD)
      y = 40 + r * (BRICK_H + BRICK_PAD)
      bricks << { x: x, y: y, hue: r * 60, alive: true }
    end
  end
  @bricks = bricks
  @ball = { x: 200.0, y: 300.0, vx: 2.5, vy: -3.5 }
  @paddle_x = 160.0
  @score = 0
  @lives = 3
end

draw do
  background 15, 15, 30

  if @state == :title
    fill 255
    textSize 36
    text "BREAKOUT", 110, 160
    textSize 16
    text "Click to start", 150, 220

    # Animate bricks on title screen
    @bricks.each do |b|
      next unless b[:alive]
      fill "hsl(\#{b[:hue]}, 70%, 55%)"
      noStroke
      rect b[:x], b[:y], BRICK_W, BRICK_H, 2
    end
  else

  # Paddle follows mouse
  @paddle_x = mouseX - PADDLE_W / 2.0
  @paddle_x = @paddle_x.clamp(0, 400 - PADDLE_W)

  if @state == :playing
    # Ball physics
    @ball[:x] += @ball[:vx]
    @ball[:y] += @ball[:vy]

    # Wall bounce
    if @ball[:x] - BALL_R < 0
      @ball[:x] = BALL_R
      @ball[:vx] = @ball[:vx].abs
    elsif @ball[:x] + BALL_R > 400
      @ball[:x] = 400 - BALL_R
      @ball[:vx] = -@ball[:vx].abs
    end
    if @ball[:y] - BALL_R < 0
      @ball[:y] = BALL_R
      @ball[:vy] = @ball[:vy].abs
    end

    # Paddle collision
    if @ball[:vy] > 0 &&
       @ball[:y] + BALL_R >= 370 && @ball[:y] + BALL_R <= 375 &&
       @ball[:x] >= @paddle_x && @ball[:x] <= @paddle_x + PADDLE_W
      @ball[:vy] = -@ball[:vy].abs
      # Add angle based on hit position
      hit_pos = (@ball[:x] - @paddle_x) / PADDLE_W - 0.5
      @ball[:vx] = hit_pos * 6
      speed = Math.sqrt(@ball[:vx]**2 + @ball[:vy]**2)
      @ball[:vx] = @ball[:vx] / speed * 4.5
      @ball[:vy] = @ball[:vy] / speed * 4.5
    end

    # Brick collision
    @bricks.each do |b|
      next unless b[:alive]
      if @ball[:x] + BALL_R > b[:x] && @ball[:x] - BALL_R < b[:x] + BRICK_W &&
         @ball[:y] + BALL_R > b[:y] && @ball[:y] - BALL_R < b[:y] + BRICK_H
        b[:alive] = false
        @score += 10
        # Determine bounce direction
        overlap_left = (@ball[:x] + BALL_R) - b[:x]
        overlap_right = (b[:x] + BRICK_W) - (@ball[:x] - BALL_R)
        overlap_top = (@ball[:y] + BALL_R) - b[:y]
        overlap_bottom = (b[:y] + BRICK_H) - (@ball[:y] - BALL_R)
        min_overlap = [overlap_left, overlap_right, overlap_top, overlap_bottom].min
        if min_overlap == overlap_left || min_overlap == overlap_right
          @ball[:vx] *= -1
        else
          @ball[:vy] *= -1
        end
        break
      end
    end

    # Ball out of bounds
    if @ball[:y] > 410
      @lives -= 1
      if @lives <= 0
        @state = :gameover
      else
        @ball = { x: 200.0, y: 300.0, vx: rand(-2.0..2.0), vy: -3.5 }
      end
    end

    # Win check
    if @bricks.none? { |b| b[:alive] }
      @state = :win
    end
  end

  # Draw bricks
  noStroke
  @bricks.each do |b|
    next unless b[:alive]
    fill "hsl(\#{b[:hue]}, 70%, 55%)"
    rect b[:x], b[:y], BRICK_W, BRICK_H, 2
  end

  text "\\u{2764}\\u{FE0F} x \#{@lives}", 330, 20

    textSize 16
    text "Score: \#{@score}", 160, 230
    textSize 14
    text "Click to restart", 150, 270
  elsif @state == :win

    fill "hsl(60, 100%, 70%)"
    textSize 30
    text "YOU WIN!", 130, 190

  end
  end
end

  elsif @state == :gameover || @state == :win

setup do
  size 400, 400
  reset_game
end

def reset_game
  @snake = [{ x: 10, y: 10 }]
  @dir = { x: 1, y: 0 }
  @next_dir = { x: 1, y: 0 }
  @food = spawn_food
  @score = 0
  @game_over = false
  @speed = 8
  @grow = 0
end

def spawn_food
  fx = rand(COLS)
  fy = rand(ROWS)
  while @snake.any? { |s| s[:x] == fx && s[:y] == fy }
    fx = rand(COLS)
    fy = rand(ROWS)
  end
  { x: fx, y: fy }
end

draw do
  background 26, 26, 46

  if @game_over
    # Draw final state
    draw_grid
    draw_snake
    draw_food

    fill "rgba(0,0,0,0.6)"
    rect 0, 0, 400, 400
    fill 255
    textSize 30
    text "GAME OVER", 110, 180
    textSize 18
    text "Score: \#{@score}", 155, 220
    textSize 14
    text "Click to restart", 145, 260
  else
    # Update at controlled speed
    if !@game_over && frameCount % (60 / @speed) == 0
      @dir = @next_dir.dup

      head = @snake.last
      new_head = { x: head[:x] + @dir[:x], y: head[:y] + @dir[:y] }

      # Wall collision
      if new_head[:x] < 0 || new_head[:x] >= COLS ||
         new_head[:y] < 0 || new_head[:y] >= ROWS
        @game_over = true
      end

      # Self collision
      if !@game_over && @snake.any? { |s| s[:x] == new_head[:x] && s[:y] == new_head[:y] }
        @game_over = true
      end

      if !@game_over
        @snake << new_head

        # Eat food?
        if new_head[:x] == @food[:x] && new_head[:y] == @food[:y]
          @score += 10
          @food = spawn_food
          @speed = [@speed + 0.5, 20].min
        else
          @snake.shift unless @grow > 0
          @grow -= 1 if @grow > 0
        end
      end
    end

    draw_grid
    draw_food
    draw_snake

    # HUD
    fill 200
    textSize 14
    text "Score: \#{@score}", 10, 18
    text "\\u{1F40D} \#{@snake.size}", 330, 18
  end
end

def draw_grid
  stroke 40, 40, 60
  strokeWeight 1
  (COLS + 1).times { |i| line i * CELL, 0, i * CELL, 400 }
  (ROWS + 1).times { |i| line 0, i * CELL, 400, i * CELL }
  noStroke
end

def draw_snake
  @snake.each_with_index do |s, i|
    t = i.to_f / @snake.size
    hue = (120 + t * 60).to_i
    fill "hsl(\#{hue}, 70%, \#{40 + t * 30}%)"
    noStroke
    rect s[:x] * CELL + 1, s[:y] * CELL + 1, CELL - 2, CELL - 2, 3
  end

  # Eyes on head
  head = @snake.last
  fill 255
  hx = head[:x] * CELL + CELL / 2
  hy = head[:y] * CELL + CELL / 2
  circle hx - 3, hy - 3, 4
  circle hx + 3, hy - 3, 4
end

def draw_food
  textSize 16
  text "\\u{1F34E}", @food[:x] * CELL + 2, @food[:y] * CELL + 16
end

keyPressed do
  case $__p_key_code
  when 37 then @next_dir = { x: -1, y: 0 } unless @dir[:x] == 1
  when 38 then @next_dir = { x: 0, y: -1 } unless @dir[:y] == 1
  when 39 then @next_dir = { x: 1, y: 0 } unless @dir[:x] == -1
  when 40 then @next_dir = { x: 0, y: 1 } unless @dir[:y] == -1
  end
end

mousePressed do

def reset_game

  @revealed = Array.new(ROWS) { Array.new(COLS, false) }
  @flagged = Array.new(ROWS) { Array.new(COLS, false) }
  @game_over = false
  @won = false
  @first_click = true
  @mines_left = MINES

def place_mines(safe_r, safe_c)
  placed = 0
  while placed < MINES
    r = rand(ROWS)
    c = rand(COLS)
    next if @board[r][c] == -1
    next if (r - safe_r).abs <= 1 && (c - safe_c).abs <= 1
    @board[r][c] = -1
    placed += 1
  end
  # Count neighbors
  ROWS.times do |r|
    COLS.times do |c|
      next if @board[r][c] == -1
      count = 0
      (-1..1).each do |dr|
        (-1..1).each do |dc|
          nr, nc = r + dr, c + dc
          next if nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS
          count += 1 if @board[nr][nc] == -1
        end
      end
      @board[r][c] = count
    end
  end
end

def reveal(r, c)
  return if r < 0 || r >= ROWS || c < 0 || c >= COLS
  return if @revealed[r][c] || @flagged[r][c]
  @revealed[r][c] = true

  if @board[r][c] == -1
    @game_over = true
    # Reveal all mines
    ROWS.times { |rr| COLS.times { |cc| @revealed[rr][cc] = true if @board[rr][cc] == -1 } }
    return
  end

  # Flood fill for 0s
  if @board[r][c] == 0
    (-1..1).each do |dr|
      (-1..1).each do |dc|
        reveal(r + dr, c + dc)
      end
    end
  end
end

def check_win
  ROWS.times do |r|
    COLS.times do |c|
      return false if @board[r][c] != -1 && !@revealed[r][c]
    end
  end
  true
end

                gv = (g.to_f / $__p_color_max[0] * 255).clamp(0, 255).to_i
                a_val = (al.to_f / $__p_color_max[3]).clamp(0, 1)
                "rgba(\#{gv},\#{gv},\#{gv},\#{a_val})"
              end
            when 3
              if $__p_color_mode == :hsb
                h = (args[0].to_f / $__p_color_max[0] * 360) % 360
                s = (args[1].to_f / $__p_color_max[1] * 100).clamp(0, 100)
                b = (args[2].to_f / $__p_color_max[2] * 100).clamp(0, 100)
                "hsl(\#{h}, \#{s}%, \#{b}%)"
              else
                r = (args[0].to_f / $__p_color_max[0] * 255).clamp(0, 255).to_i
                g = (args[1].to_f / $__p_color_max[1] * 255).clamp(0, 255).to_i
                b = (args[2].to_f / $__p_color_max[2] * 255).clamp(0, 255).to_i
                "rgb(\#{r},\#{g},\#{b})"
              end
            when 4
              if $__p_color_mode == :hsb
                h = (args[0].to_f / $__p_color_max[0] * 360) % 360
                s = (args[1].to_f / $__p_color_max[1] * 100).clamp(0, 100)
                b = (args[2].to_f / $__p_color_max[2] * 100).clamp(0, 100)
                a_val = (args[3].to_f / $__p_color_max[3]).clamp(0, 1)
                "hsla(\#{h}, \#{s}%, \#{b}%, \#{a_val})"
              else
                r = (args[0].to_f / $__p_color_max[0] * 255).clamp(0, 255).to_i
                g = (args[1].to_f / $__p_color_max[1] * 255).clamp(0, 255).to_i
                b = (args[2].to_f / $__p_color_max[2] * 255).clamp(0, 255).to_i
                a_val = (args[3].to_f / $__p_color_max[3]).clamp(0, 1)
                "rgba(\#{r},\#{g},\#{b},\#{a_val})"
              end
            else
              "rgb(255,255,255)"
            end
          end

          def color(*args)
            _p_parse_color(*args)
          end

          def lerpColor(c1, c2, amt)
            c1.to_s
          end

          # ── rectMode / ellipseMode ──
          $__p_rect_mode = :corner
          $__p_ellipse_mode = :center

          def rectMode(mode)
            $__p_rect_mode = mode
          end

          def ellipseMode(mode)
            $__p_ellipse_mode = mode
          end

          def rect(x, y, w, h, *radii)
            rx, ry, rw, rh = x, y, w, h
            case $__p_rect_mode
            when :center
              rx = x - w / 2.0
              ry = y - h / 2.0
            when :corners
              rw = w - x
              rh = h - y
            when :radius
              rx = x - w
              ry = y - h
              rw = w * 2
              rh = h * 2
            end

            if !radii.empty?
              r = radii[0] || 0
              $__canvas_ctx.beginPath
              $__canvas_ctx.moveTo(rx + r, ry)
              $__canvas_ctx.lineTo(rx + rw - r, ry)
              $__canvas_ctx.quadraticCurveTo(rx + rw, ry, rx + rw, ry + r)
              $__canvas_ctx.lineTo(rx + rw, ry + rh - r)
              $__canvas_ctx.quadraticCurveTo(rx + rw, ry + rh, rx + rw - r, ry + rh)
              $__canvas_ctx.lineTo(rx + r, ry + rh)
              $__canvas_ctx.quadraticCurveTo(rx, ry + rh, rx, ry + rh - r)
              $__canvas_ctx.lineTo(rx, ry + r)
              $__canvas_ctx.quadraticCurveTo(rx, ry, rx + r, ry)
              $__canvas_ctx.closePath
              if $__p_fill
                $__canvas_ctx.fillStyle = $__p_fill_color
                $__canvas_ctx.fill
              end
              if $__p_stroke
                $__canvas_ctx.strokeStyle = $__p_stroke_color
                $__canvas_ctx.stroke
              end
            else
              if $__p_fill
                $__canvas_ctx.fillStyle = $__p_fill_color
                $__canvas_ctx.fillRect(rx, ry, rw, rh)
              end
              if $__p_stroke
                $__canvas_ctx.strokeStyle = $__p_stroke_color
                $__canvas_ctx.strokeRect(rx, ry, rw, rh)
              end
            end
          end

          def ellipse(x, y, w, h = w)
            cx, cy, rw, rh = x, y, w, h
            case $__p_ellipse_mode
            when :corner
              cx = x + w / 2.0
              cy = y + h / 2.0
            when :corners
              cx = (x + w) / 2.0
              cy = (y + h) / 2.0
              rw = (w - x).abs
              rh = (h - y).abs
            when :radius
              rw = w * 2
              rh = h * 2
            end
            sx = [rw.to_f / 2, 0.001].max
            sy = [rh.to_f / 2, 0.001].max
            $__canvas_ctx.save
            $__canvas_ctx.translate(cx, cy)
            $__canvas_ctx.scale(sx, sy)
            $__canvas_ctx.beginPath
            $__canvas_ctx.arc(0, 0, 1, 0, Math::PI * 2)
            $__canvas_ctx.restore
            if $__p_fill
              $__canvas_ctx.fillStyle = $__p_fill_color
              $__canvas_ctx.fill
            end
            if $__p_stroke
              $__canvas_ctx.strokeStyle = $__p_stroke_color
              $__canvas_ctx.stroke
            end
          end

          def circle(x, y, d)
            ellipse(x, y, d, d)
          end

          def square(x, y, s)
            rect(x, y, s, s)
          end

          # ── Transform (with block support) ──
          def push(&block)
            $__canvas_ctx.save
            if block
              block.call
              $__canvas_ctx.restore
            end
          end

          def pop
            $__canvas_ctx.restore
          end

          def pushMatrix(&block)
            push(&block)
          end

          def popMatrix
            pop
          end

          def pushStyle(&block)
            push(&block)
          end

          def popStyle
            pop
          end

          def translate(x, y)
            $__canvas_ctx.translate(x, y)
          end

          def rotate(angle)
            $__canvas_ctx.rotate(angle)
          end

          def scale(x, y = x)
            $__canvas_ctx.scale(x, y)
          end

          def strokeCap(cap)
            val = case cap
                  when :round, "round" then "round"
                  when :square, "square", :project, "project" then "square"
                  when :butt, "butt" then "butt"
                  else cap.to_s
                  end
            $__canvas_ctx.lineCap = val
          end

          def strokeJoin(join)
            val = case join
                  when :round, "round" then "round"
                  when :miter, "miter" then "miter"
                  when :bevel, "bevel" then "bevel"
                  else join.to_s
                  end
            $__canvas_ctx.lineJoin = val
          end

          def bezier(x1, y1, cx1, cy1, cx2, cy2, x2, y2)
            $__canvas_ctx.beginPath
            $__canvas_ctx.moveTo(x1, y1)
            $__canvas_ctx.bezierCurveTo(cx1, cy1, cx2, cy2, x2, y2)
            if $__p_stroke
              $__canvas_ctx.strokeStyle = $__p_stroke_color
              $__canvas_ctx.stroke
            end
          end

          def curve(x1, y1, x2, y2, x3, y3, x4, y4)
            cp1x = x2 + (x3 - x1) / 6.0
            cp1y = y2 + (y3 - y1) / 6.0
            cp2x = x3 - (x4 - x2) / 6.0
            cp2y = y3 - (y4 - y2) / 6.0
            $__canvas_ctx.beginPath
            $__canvas_ctx.moveTo(x2, y2)
            $__canvas_ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, x3, y3)
            if $__p_stroke
              $__canvas_ctx.strokeStyle = $__p_stroke_color
              $__canvas_ctx.stroke
            end
          end

          # ── Math helpers ──
          def constrain(val, low, high)
            val.clamp(low, high)
          end

          def self.map(value, start1, stop1, start2, stop2)
            start2 + (stop2 - start2) * ((value - start1).to_f / (stop1 - start1))
          end

          def map(value, start1, stop1, start2, stop2)
            start2 + (stop2 - start2) * ((value - start1).to_f / (stop1 - start1))
          end

          def lerp(start_val, stop_val, amt)
            start_val + (stop_val - start_val) * amt
          end

          def dist(*args)
            if args.size == 4
              x1, y1, x2, y2 = args
              Math.sqrt((x2 - x1)**2 + (y2 - y1)**2)
            elsif args.size == 6
              x1, y1, z1, x2, y2, z2 = args
              Math.sqrt((x2 - x1)**2 + (y2 - y1)**2 + (z2 - z1)**2)
            end
          end

          def mag(x, y, z = 0)
            Math.sqrt(x*x + y*y + z*z)
          end

          def norm(value, start_val, stop_val)
            (value - start_val).to_f / (stop_val - start_val)
          end

          def sq(n); n * n; end
          def pow(n, e); n ** e; end
          def degrees(radians); radians * RAD_TO_DEG; end
          def radians(degrees); degrees * DEG_TO_RAD; end
          def abs(n); n.abs; end
          def ceil(n); n.ceil; end
          def floor(n); n.floor; end
          def round(n); n.round; end
          def min(*args); args.flatten.min; end
          def max(*args); args.flatten.max; end
          def log(n); Math.log(n); end
          def exp(n); Math.exp(n); end
          def sqrt(n); Math.sqrt(n); end

          # Perlin noise
          $__p_noise_seed = 0
          $__p_noise_table = nil

          def _p_init_noise
            return if $__p_noise_table
            rng = Random.new(42)
            $__p_noise_table = Array.new(512) { rng.rand }
          end

          def noise(x, y = 0, z = 0)
            _p_init_noise
            xi = x.floor
            yi = y.floor
            xf = x - xi
            yf = y - yi
            u = xf * xf * (3 - 2 * xf)
            v = yf * yf * (3 - 2 * yf)
            i00 = $__p_noise_table[(xi + yi * 57) % 512]
            i10 = $__p_noise_table[(xi + 1 + yi * 57) % 512]
            i01 = $__p_noise_table[(xi + (yi + 1) * 57) % 512]
            i11 = $__p_noise_table[(xi + 1 + (yi + 1) * 57) % 512]
            lerp(lerp(i00, i10, u), lerp(i01, i11, u), v)
          end

          def noiseSeed(seed)
            rng = Random.new(seed)
            $__p_noise_table = Array.new(512) { rng.rand }
          end

          def randomSeed(seed)
            $__p_random = Random.new(seed)
          end

          def randomGaussian
            u1 = rand
            u2 = rand
            Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math::PI * u2)
          end

          # ── Mouse events ──
          $__p_mouse_pressed = false
          $__p_mouse_button = 0
          $__p_pmouse_x = 0
          $__p_pmouse_y = 0

          def mousePressed(&block)
            if block
              Sketch.class_variable_set(:@@mouse_pressed_block, block)
            else
              $__p_mouse_pressed
            end
          end

          def mouseReleased(&block)
            Sketch.class_variable_set(:@@mouse_released_block, block) if block
          end

          def mouseMoved(&block)
            Sketch.class_variable_set(:@@mouse_moved_block, block) if block
          end

          def mouseDragged(&block)
            Sketch.class_variable_set(:@@mouse_dragged_block, block) if block
          end

          def mouseClicked(&block)
            Sketch.class_variable_set(:@@mouse_clicked_block, block) if block
          end

          def pmouseX; $__p_pmouse_x; end
          def pmouseY; $__p_pmouse_y; end
          def mouseButton; $__p_mouse_button; end
          def mousePressed?; $__p_mouse_pressed; end

          # ── Key events ──
          $__p_key = ""
          $__p_key_code = 0
          $__p_key_pressed = false

          def keyPressed(&block)
            if block
              Sketch.class_variable_set(:@@key_pressed_block, block)
            else
              $__p_key_pressed
            end
          end

          def keyReleased(&block)
            Sketch.class_variable_set(:@@key_released_block, block) if block
          end

          def keyTyped(&block)
            Sketch.class_variable_set(:@@key_typed_block, block) if block
          end

          def key; $__p_key; end
          def keyCode; $__p_key_code; end
          def keyIsPressed; $__p_key_pressed; end

          # ── loop / noLoop / redraw / frameRate ──
          $__p_looping = true
          $__p_target_fps = 60
          $__p_needs_redraw = false

          def loop
            $__p_looping = true
          end

          def noLoop
            $__p_looping = false
          end

          def redraw
            $__p_needs_redraw = true
          end

          def frameRate(fps = nil)
            if fps
              $__p_target_fps = fps
            else
              $__p_current_fps || 60
            end
          end

          # ── Vector class ──
          class PVector
            attr_accessor :x, :y, :z
            def initialize(x = 0, y = 0, z = 0)
              @x, @y, @z = x.to_f, y.to_f, z.to_f
            end
            def set(x, y = 0, z = 0)
              @x, @y, @z = x.to_f, y.to_f, z.to_f; self
            end
            def copy; PVector.new(@x, @y, @z); end
            def add(v); @x += v.x; @y += v.y; @z += v.z; self; end
            def sub(v); @x -= v.x; @y -= v.y; @z -= v.z; self; end
            def mult(n); @x *= n; @y *= n; @z *= n; self; end
            def div(n); @x /= n; @y /= n; @z /= n; self; end
            def mag; Math.sqrt(@x*@x + @y*@y + @z*@z); end
            def magSq; @x*@x + @y*@y + @z*@z; end
            def normalize; m = mag; div(m) if m > 0; self; end
            def limit(max); mult(max / mag) if mag > max; self; end
            def heading; Math.atan2(@y, @x); end
            def dist(v); Math.sqrt((@x-v.x)**2 + (@y-v.y)**2 + (@z-v.z)**2); end
            def dot(v); @x*v.x + @y*v.y + @z*v.z; end
            def lerp(v, amt); @x += (v.x - @x) * amt; @y += (v.y - @y) * amt; @z += (v.z - @z) * amt; self; end
            def rotate(angle)
              c = Math.cos(angle); s = Math.sin(angle)
              nx = @x * c - @y * s; ny = @x * s + @y * c
              @x, @y = nx, ny; self
            end
            def to_s; "(\#{@x}, \#{@y}, \#{@z})"; end
            def to_a; [@x, @y, @z]; end

            def self.add(a, b); a.copy.add(b); end
            def self.sub(a, b); a.copy.sub(b); end
            def self.mult(v, n); v.copy.mult(n); end
            def self.div(v, n); v.copy.div(n); end
            def self.dist(a, b); a.dist(b); end
            def self.dot(a, b); a.dot(b); end
            def self.fromAngle(angle); PVector.new(Math.cos(angle), Math.sin(angle)); end
            def self.random2D; fromAngle(rand * Math::PI * 2); end
          end

          def createVector(x = 0, y = 0, z = 0)
            PVector.new(x, y, z)
          end

          # ── Setup / Draw DSL ──
          def setup(&block)
            if block
              Sketch.class_variable_set(:@@setup_block, block)
            end
          end

          def draw(&block)
            Sketch.class_variable_set(:@@draw_block, block)
          end

          # Snake_case aliases
          alias no_fill noFill
          alias no_stroke noStroke
          alias stroke_weight strokeWeight
          alias text_size textSize
          alias text_align textAlign
          alias push_matrix pushMatrix
          alias pop_matrix popMatrix
          alias push_style pushStyle
          alias pop_style popStyle
          alias frame_count frameCount
          alias mouse_x mouseX
          alias mouse_y mouseY
          alias pmouse_x pmouseX
          alias pmouse_y pmouseY
          alias mouse_button mouseButton
          alias stroke_cap strokeCap
          alias stroke_join strokeJoin
          alias color_mode colorMode
          alias rect_mode rectMode
          alias ellipse_mode ellipseMode
          alias no_loop noLoop
          alias frame_rate frameRate
          alias create_vector createVector
          alias begin_shape beginShape
          alias end_shape endShape
          alias bezier_vertex bezierVertex
          alias curve_vertex curveVertex
          alias noise_seed noiseSeed
          alias random_seed randomSeed
          alias random_gaussian randomGaussian
          alias lerp_color lerpColor
        `);

        statusEl.textContent = 'Ready';
        statusEl.className = 'status ready';
        runBtn.disabled = false;
        logConsole(`Ruby ${rubyVM.eval('RUBY_VERSION')} loaded successfully!`, 'output');
        logConsole('Processing/RubySketch-compatible API ready', 'info');
      } catch (e) {
        statusEl.textContent = 'Error loading';
        statusEl.className = 'status error';
        logConsole(`Failed to load ruby.wasm: ${e.message}`, 'error');
        console.error(e);
      }
    }

    // ── Sketch execution ──
    function stopSketch() {
      if (animationId) {
        cancelAnimationFrame(animationId);
        animationId = null;
      }
      running = false;
      stopBtn.style.display = 'none';
      runBtn.style.display = '';
      fpsCounter.textContent = '';
    }

    function runSketch() {
      stopSketch();
      clearConsole();

      const code = editor.value;
      if (!code.trim()) {
        logConsole('No code to run.', 'error');
        return;
      }

      try {
        rubyVM.eval('Sketch.reset!');
        rubyVM.eval(`
          instance_variables.each do |v|
            remove_instance_variable(v)
          end
        `);

        rubyVM.eval(code);

        const hasDrawBlock = rubyVM.eval('!Sketch.draw_block.nil?').toString() === 'true';
        const hasSetupBlock = rubyVM.eval('!Sketch.setup_block.nil?').toString() === 'true';

        if (!hasDrawBlock) {
          logConsole('No draw block defined. Use: draw { ... }', 'info');
          return;
        }

        rubyVM.eval(`
          $__js_ctx = JS.global[:document].call(:getElementById, "sketchCanvas").call(:getContext, "2d")
          $__canvas_ctx = CanvasContext.new($__js_ctx)
        `);

        if (hasSetupBlock) {
          rubyVM.eval('Sketch.setup_block.call');
        }

        const w = parseInt(rubyVM.eval('$__p_width').toString(), 10) || 400;
        const h = parseInt(rubyVM.eval('$__p_height').toString(), 10) || 400;
        canvas.width = w;
        canvas.height = h;

        rubyVM.eval(`
          $__js_ctx = JS.global[:document].call(:getElementById, "sketchCanvas").call(:getContext, "2d")
          $__canvas_ctx = CanvasContext.new($__js_ctx)
        `);

        statusEl.textContent = 'Running';
        statusEl.className = 'status running';
        running = true;
        runBtn.style.display = 'none';
        stopBtn.style.display = '';
        frameCount = 0;
        lastFpsTime = performance.now();

        logConsole(`Sketch started (${w}x${h})`, 'output');

        const startTime = performance.now();
        let lastFrameTime = 0;

        function loop(timestamp) {
          if (!running) return;

          try {
            const looping = rubyVM.eval('$__p_looping').toString() === 'true';
            const needsRedraw = rubyVM.eval('$__p_needs_redraw').toString() === 'true';
            const targetFps = parseInt(rubyVM.eval('$__p_target_fps').toString(), 10) || 60;
            const frameInterval = 1000 / targetFps;

            if (!looping && !needsRedraw) {
              animationId = requestAnimationFrame(loop);
              return;
            }

            if (needsRedraw) {
              rubyVM.eval('$__p_needs_redraw = false');
            }

            if (timestamp - lastFrameTime < frameInterval * 0.95) {
              animationId = requestAnimationFrame(loop);
              return;
            }
            lastFrameTime = timestamp;

            const t = (performance.now() - startTime) / 1000;
            frameCount++;

            rubyVM.eval(`$__p_pmouse_x = $__p_mouse_x; $__p_pmouse_y = $__p_mouse_y; $__p_elapsed_time = ${t}; $__p_frame_count = ${frameCount}; $__p_mouse_x = ${jsMouseX}; $__p_mouse_y = ${jsMouseY}; $__p_current_fps = ${Math.round(frameCount * 1000 / Math.max(performance.now() - lastFpsTime, 1))}; Sketch.draw_block.call`);

            const now = performance.now();
            if (now - lastFpsTime >= 1000) {
              const fps = Math.round(frameCount * 1000 / (now - lastFpsTime));
              fpsCounter.textContent = `${fps} fps`;
              frameCount = 0;
              lastFpsTime = now;
            }
          } catch (e) {
            logConsole(`Runtime error: ${e.message}`, 'error');
            stopSketch();
            statusEl.textContent = 'Error';
            statusEl.className = 'status error';
            return;
          }

          animationId = requestAnimationFrame(loop);
        }

        animationId = requestAnimationFrame(loop);
      } catch (e) {
        logConsole(`Error: ${e.message}`, 'error');
        statusEl.textContent = 'Error';
        statusEl.className = 'status error';
      }
    }

    // ── Event handlers ──
    runBtn.addEventListener('click', runSketch);
    stopBtn.addEventListener('click', () => {
      stopSketch();
      statusEl.textContent = 'Ready';
      statusEl.className = 'status ready';
    });

    editor.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        runSketch();
      }
      if (e.key === 'Tab') {
        e.preventDefault();
        const start = editor.selectionStart;
        const end = editor.selectionEnd;
        editor.value = editor.value.substring(0, start) + '  ' + editor.value.substring(end);
        editor.selectionStart = editor.selectionEnd = start + 2;
      }
    });

    // ── Init ──
    renderSidebar();
    selectExample('hello');
    initRuby();
  </script>
