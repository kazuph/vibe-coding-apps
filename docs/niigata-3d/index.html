<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>新潟駅 3Dマップ</title>
<meta name="description" content="改修完成後（2027年春予定）の新潟駅万代広場と、万代島・朱鷺メッセ、白山・りゅーとぴあ周辺を PLATEAU 実測データと公式資料から再現した3Dマップ">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%230e5e6f'/><path d='M12 44h40M18 44V26l14-8 14 8v18' stroke='white' stroke-width='5' fill='none'/></svg>">
<style>
:root{
  --bg:#f4f1ea; --panel:rgba(255,255,255,.92); --ink:#1d2a30; --sub:#5b6b72; --line:#d8d2c4;
  --accent:#0e7c8a; --plan:#e0662b; --measured:#3b7d3a; --estimate:#b8860b; --chip:#eef3f3;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#151a1d; --panel:rgba(24,30,34,.92); --ink:#e7eef0; --sub:#9aabb2; --line:#34424a; --chip:#22302f; }
}
:root[data-theme="dark"]{ --bg:#151a1d; --panel:rgba(24,30,34,.92); --ink:#e7eef0; --sub:#9aabb2; --line:#34424a; --chip:#22302f; }
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#top{position:fixed;left:12px;right:12px;top:12px;display:flex;gap:8px;align-items:flex-start;pointer-events:none;z-index:5}
.card{background:var(--panel);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.12);pointer-events:auto}
#title{padding:10px 14px;min-width:0}
#title h1{font-size:16px;margin:0;letter-spacing:.02em}
#title p{margin:2px 0 0;font-size:11.5px;color:var(--sub)}
#areas{display:flex;flex-wrap:wrap;gap:6px;padding:8px}
#areas button,.tog{font:inherit;font-size:12.5px;border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:7px 11px;border-radius:999px;cursor:pointer;white-space:nowrap}
#areas button.on{background:var(--accent);border-color:var(--accent);color:#fff}
#side{position:fixed;right:12px;top:120px;width:340px;max-height:calc(100% - 200px);overflow:auto;padding:14px 16px;z-index:5}
#side h2{font-size:16px;margin:0 0 4px}
#side .meta{font-size:12px;color:var(--sub);margin-bottom:8px}
#side p,#side li{font-size:13px;line-height:1.65}
#side ul{padding-left:18px;margin:6px 0}
#side a{color:var(--accent);word-break:break-all}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:6px;color:#fff;margin-right:4px;vertical-align:1px}
.b-m{background:var(--measured)} .b-p{background:var(--plan)} .b-e{background:var(--estimate)} .b-o{background:#6b7c86}
#toggles{position:fixed;left:12px;bottom:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;max-width:calc(100% - 24px);z-index:5}
.tog.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#legend{position:fixed;right:12px;bottom:12px;padding:8px 12px;font-size:11.5px;color:var(--sub);z-index:5;line-height:1.7}
#legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
#labels{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.lbl{position:absolute;transform:translate(-50%,-100%);font-size:12px;font-weight:600;color:#10242b;background:rgba(255,255,255,.88);border:1px solid rgba(0,0,0,.12);border-radius:8px;padding:2px 8px;white-space:nowrap;pointer-events:auto;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.lbl.plan{background:rgba(224,102,43,.95);color:#fff;border-color:transparent}
.lbl::after{content:"";position:absolute;left:50%;bottom:-6px;width:1px;height:6px;background:rgba(0,0,0,.35)}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:20;font-size:14px;color:var(--sub)}
#close{position:absolute;right:10px;top:8px;border:none;background:transparent;font-size:18px;color:var(--sub);cursor:pointer}
#hint .sp{display:none}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:70px;font-size:12px;color:var(--sub);background:var(--panel);padding:5px 12px;border-radius:999px;border:1px solid var(--line);z-index:4;pointer-events:none;transition:opacity .6s}
@media (max-width:760px){
  #top{flex-direction:column;left:8px;right:8px;top:8px;gap:6px}
  #title{padding:8px 12px} #title h1{font-size:14px} #title p{display:none}
  #areas{padding:6px;gap:5px;overflow-x:auto;flex-wrap:nowrap;max-width:100%}
  #areas button,.tog{font-size:12px;padding:6px 10px}
  #side{left:8px;right:8px;width:auto;top:auto;bottom:62px;max-height:42%;padding:12px 14px}
  #toggles{left:8px;bottom:8px;right:8px;flex-wrap:nowrap;overflow-x:auto}
  #legend{display:none}
  #hint{bottom:62px;white-space:nowrap} #hint .pc{display:none} #hint .sp{display:inline}
  .lbl{font-size:11px;padding:1px 6px}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>
<div id="top">
  <div id="title" class="card"><h1>🚉 新潟駅 3Dマップ <span style="font-weight:400;font-size:12px;color:var(--sub)">完成予想 2027</span></h1><p>PLATEAU実測建物 × 新潟市の公式整備計画から再現</p></div>
  <div id="areas" class="card"></div>
</div>
<div id="side" class="card"><button id="close" aria-label="閉じる">×</button><div id="sideBody"></div></div>
<div id="toggles" class="card"></div>
<div id="legend" class="card">
  <div><i style="background:#e0662b"></i>計画・整備中（公式図から再現）</div>
  <div><i style="background:#cfd6da"></i>既存建物（PLATEAU 実測高）</div>
  <div><i style="background:#b8860b"></i>寸法が非公表 → 推定値</div>
</div>
<div id="hint"><span class="pc">ドラッグで回転 ・ 右ドラッグで移動 ・ ホイールでズーム ・ 建物クリックで実測高さ</span><span class="sp">1本指で回転 ・ 2本指で移動/ズーム</span></div>
<div id="loading">3D都市データを読み込み中…</div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module" src="./app.js"></script>
</body>
</html>
