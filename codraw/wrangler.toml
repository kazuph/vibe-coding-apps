name = "codraw"
main = "worker.ts"
compatibility_date = "2024-09-01"

# Serve static files produced by `vite build`.
assets = { directory = "./dist", binding = "ASSETS", html_handling = "force-trailing-slash", not_found_handling = "single-page-application", run_worker_first = true }

# Run Vite automatically before deploy/dev
[build]
command = "vite build"

# If you want to bind a custom domain, add routes here later:
# routes = [
#   { pattern = "codraw.example.com", custom_domain = true }
# ]
